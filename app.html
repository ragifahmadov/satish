</style>

<script>
/* ============ ICONS ============ */
const ICONS = {
  dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="9" rx="1.3"/><rect x="14" y="3" width="7" height="5" rx="1.3"/><rect x="14" y="12" width="7" height="9" rx="1.3"/><rect x="3" y="16" width="7" height="5" rx="1.3"/></svg>',

  inquiry:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/><path d="M8.2 10.5h4.6M10.5 8.2v4.6"/></svg>',
  calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 3v4M16 3v4"/><path d="M8.5 14l1.8 1.8L13.5 12.3"/></svg>',

  court:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 4v16M8 20h8M4 7h16"/><path d="M4 7l-2.5 6.5a2.5 2.5 0 005 0z"/><path d="M20 7l-2.5 6.5a2.5 2.5 0 005 0z"/></svg>',

const AZ_MONTHS=['Yanvar','Fevral','Mart','Aprel','May','İyun','İyul','Avqust','Sentyabr','Oktyabr','Noyabr','Dekabr'];

/* ============ STATE ============ */
const state={salespeople:[],collectors:[],curators:[],customers:[],contracts:[],payments:[]};
let paymentSums={};   // müqavilə id -> ödənişlərin cəmi (geri qaytarma xaric; yüngül, tam sətirlər olmadan)
let returnSums={};    // müqavilə id -> geri qaytarılan (mal qaytarılması) məbləğ, müsbət ədəd
let paymentLast={};   // müqavilə id -> ən son real ödəniş tarixi (YYYY-MM-DD)
let dashMonthTotal=0; // bu ay toplanan (idarə paneli)
function upsertInState(col, item){
  if(!state[col] || !item || !item.id) return;
  const idx=state[col].findIndex(x=>x.id===item.id);
  if(idx>=0) state[col][idx]=item; else state[col].push(item);
}
function removeFromState(col, id){
  if(!state[col]) return;
  state[col]=state[col].filter(x=>x.id!==id);
}
let currentScreen='contracts';

const SCREENS=[
  {id:'dashboard',label:'İdarə paneli',icon:'dashboard'},
  {id:'salespeople',label:'Satıcılar',icon:'sales'},
  {id:'collectors',label:'Təhsilatçılar',icon:'collector'},
  {id:'curators',label:'Kuratorlar',icon:'curator'},
  {id:'customers',label:'Müştərilər',icon:'customers'},
  {id:'contracts',label:'Müqavilələr',icon:'contract'},
  {id:'payments',label:'Ödənişlər',icon:'payment'},
  {id:'reassign',label:'Təhsilatçı dəyişikliyi',icon:'reassign'},
  {id:'reassign-curator',label:'Kurator dəyişikliyi',icon:'reassign'},
  {id:'debt-inquiry',label:'Müştəri borc sorğusu',icon:'inquiry'},
  {id:'reports',label:'Hesabatlar',icon:'reports',children:[{id:'report-overdue',label:'Gecikmiş müqavilələr'}]},
];

/* ============ HELPERS ============ */
function fmtMoney(n){ n=Number(n)||0; return n.toLocaleString('az-AZ',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₼'; }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear(); }
function esc(s){ return (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fullName(o){ if(!o) return ''; return [o.soyad,o.ad,o.ataAdi].filter(Boolean).join(' '); }
function byId(arr,id){ return arr.find(x=>x.id===id); }
function phonesToArr(str){ return (str||'').split(',').map(s=>s.trim()).filter(Boolean); }

function customerName(id){ const c=byId(state.customers,id); return c?fullName(c):'—'; }
function salespersonName(id){ const s=byId(state.salespeople,id); return s?fullName(s):'—'; }
function collectorName(id){ const c=byId(state.collectors,id); return c?fullName(c):'—'; }
function curatorName(id){ const c=byId(state.curators,id); return c?fullName(c):'—'; }
function currentYm(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

function scheduleMonths(contract){
  const out=[]; if(!contract.tarix||!contract.muddet) return out;
  const start=new Date(contract.tarix+'T00:00:00');
  for(let i=1;i<=Number(contract.muddet);i++){
    const d=new Date(start.getFullYear(), start.getMonth()+i, 1);
    out.push({index:i,label:'Ay '+i+' — '+AZ_MONTHS[d.getMonth()]+' '+d.getFullYear(),date:d});
  }
  return out;
}
// "Geri qaytarma" (mal qaytarılması) əməliyyatı cədvəldə mənfi məbləğlə görünür, amma
// ödəniş sayılmır — müqavilənin xalis satış məbləğini azaldır.
function isReturnPayment(p){ return !!p && p.emeliyyatNovu==='Geri qaytarma'; }
function contractPaidSum(contractId){ return Number(paymentSums[contractId])||0; }
function contractReturnedSum(contractId){ return Number(returnSums[contractId])||0; }
function contractNetSale(contract){ return (Number(contract.meblag)||0) - contractReturnedSum(contract.id); }
function contractMonthly(contract){
  const m=Number(contract.muddet)||0; if(!m) return 0;
  return Math.max(0,(contractNetSale(contract)-(Number(contract.ilkinOdenis)||0))/m);
}
function contractDebt(contract){
  return contractNetSale(contract) - (Number(contract.ilkinOdenis)||0) - contractPaidSum(contract.id);
}
function contractScheduleDebt(contract){
  return Math.max(0, contractMonthly(contract)*scheduleDueCount(contract) - contractPaidSum(contract.id));
}
function currentCollectorForContract(contract,onDate){
  const d=onDate?new Date(onDate):new Date();
  const list=contract.tehsilatciTeyinatlari||[];
  const hit=list.find(a=>{
    const s=a.baslama?new Date(a.baslama):null;
    const e=a.son?new Date(a.son):null;
    return (!s||d>=s)&&(!e||d<=e);
  });
  return hit?hit.collectorId:(list.length?list[list.length-1].collectorId:null);
}
// Müqavilələr siyahısında göstərilən təhsilatçı: "Son" xanası boş olan təyinat (davam edən təyinat)
function activeCollectorForContract(contract){
  const list=contract.tehsilatciTeyinatlari||[];
  const hit=list.find(a=>!a.son);
  return hit?hit.collectorId:(list.length?list[list.length-1].collectorId:null);
}

const PSEUDO_LOADERS={
  paymentSums: async ()=>{
    const r=await apiPaymentSums();

async function ensureLoaded(cols){
  const need=cols.filter(c=>!loadedCols.has(c));
  if(!need.length) return;
  await Promise.all(need.map(async c=>{
    if(PSEUDO_LOADERS[c]) await PSEUDO_LOADERS[c]();
    else state[c]=await apiList(c);
    loadedCols.add(c);
  }));
}

const loadedContractPayments=new Set();
async function ensureContractPayments(contractId){
  if(loadedCols.has('payments') || loadedContractPayments.has(contractId)) return;
  const fresh=await apiPaymentsForContract(contractId);
  state.payments=state.payments.filter(p=>p.contractId!==contractId).concat(fresh);
  loadedContractPayments.add(contractId);

function clearFieldErrors(form){
  form.querySelectorAll('.field-err').forEach(e=>{ e.textContent=''; e.style.display='none'; });
  form.querySelectorAll('.input-error').forEach(e=>e.classList.remove('input-error'));
}
function setFieldError(form, name, msg){
  const input=form.querySelector(`[name="${name}"]`);
  if(input) input.classList.add('input-error');
  const errEl=form.querySelector(`.field-err[data-err-for="${name}"]`);
  if(errEl){ errEl.textContent=msg; errEl.style.display='block'; }
}
function isDuplicate(list, field, value, excludeId){
  if(!value) return false;
  const v=value.trim().toLowerCase();
  return list.some(item=>item.id!==excludeId && (item[field]||'').toString().trim().toLowerCase()===v);
}
function calcAge(dateStr){
  const b=new Date(dateStr+'T00:00:00');
  if(isNaN(b)) return null;
  const now=new Date();
  let age=now.getFullYear()-b.getFullYear();
  const mDiff=now.getMonth()-b.getMonth();
  if(mDiff<0 || (mDiff===0 && now.getDate()<b.getDate())) age--;
  return age;
}
function bindDigitsOnly(form){
  ['elaqeNomre1','elaqeNomre2'].forEach(n=>{
    const el=form.querySelector(`[name="${n}"]`);
    if(el) el.addEventListener('input', ()=>{ el.value=el.value.replace(/\D/g,'').slice(0,9); });
  });
}

function paginateArr(array, key, size){
  size=size||PAGE_SIZE;

  const totalPages=Math.max(1, Math.ceil(total/size));
  if(pageNum[key]>totalPages) pageNum[key]=totalPages;
  if(pageNum[key]<1) pageNum[key]=1;
  const start=(pageNum[key]-1)*size;
  return {pageRows:array.slice(start,start+size), totalPages, total};

async function submitSimpleForm(form){
  clearFieldErrors(form);
  const key=form.dataset.key, id=form.dataset.id;
  const fd=new FormData(form);
  const data={
    kod:fd.get('kod')||'', soyad:fd.get('soyad')||'', ad:fd.get('ad')||'', ataAdi:fd.get('ataAdi')||'',
    vesiqeSeriya:fd.get('vesiqeSeriya')||'', vesiqeNomre:fd.get('vesiqeNomre')||'',
    finKod:fd.get('finKod')||'', qeydiyyatUnvani:fd.get('qeydiyyatUnvani')||'', faktikiUnvan:fd.get('faktikiUnvan')||'',
    elaqeNomre1:fd.get('elaqeNomre1')||'', elaqeNomre2:fd.get('elaqeNomre2')||'', qeyd:fd.get('qeyd')||'',
  };
  let ok=true;
  if(data.finKod.length!==7){ setFieldError(form,'finKod','Fini tam daxil edin'); ok=false; }
  else if(!id && isDuplicate(state[key],'finKod',data.finKod,id)){ setFieldError(form,'finKod','Daxil etdiyiniz fin təkrarlanır'); ok=false; }
  if(!id && isDuplicate(state[key],'kod',data.kod,id)){ setFieldError(form,'kod','Daxil etdiyiniz kod təkrarlanır'); ok=false; }
  if(data.elaqeNomre1.length!==9){ setFieldError(form,'elaqeNomre1','Əlaqə nömrəsini tam daxil edin'); ok=false; }
  if(data.elaqeNomre2 && data.elaqeNomre2.length!==9){ setFieldError(form,'elaqeNomre2','Əlaqə nömrəsini tam daxil edin'); ok=false; }
  if(!ok) return;
  const saved = id ? await apiUpdate(key,id,data) : await apiAdd(key,data);
  upsertInState(key, saved);
  closeModal();
  renderScreen();
}

/* ============ PAYMENTS ============ */
let paymentsContractId=null;

function scheduleDueCount(contract){
  const months=scheduleMonths(contract);
  const today=new Date(); today.setHours(0,0,0,0);
  let due=0;
  for(const m of months){ if(m.date<=today) due=m.index; else break; }
  return due;
}
function currentScheduleIndex(contract){
  const due=scheduleDueCount(contract);
  const muddet=Number(contract.muddet)||1;
  return Math.min(Math.max(due,1), muddet);
}
function todayIso(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

  input.addEventListener('focus', ()=>renderList(input.value));

function buildScheduleRowsHtml(contract){
  const months=scheduleMonths(contract);
  const curIdx=currentScheduleIndex(contract);
  const monthly=contractMonthly(contract);
  const pays=state.payments.filter(p=>p.contractId===contract.id && !isReturnPayment(p));
  return months.map(m=>{
    const faktiki=pays.filter(p=>Number(p.qrafikAyIndex)===m.index).reduce((s,p)=>s+(Number(p.meblag)||0),0);
    if(m.index<curIdx){
      const ok=faktiki>=monthly-0.01;
      return `<tr class="muted">
        <td>${esc(m.label)}</td><td class="num">${fmtMoney(monthly)}</td><td class="num">${fmtMoney(faktiki)}</td>
        <td><span class="tag ${ok?'tag-green':'tag-red'}">${ok?'Ödənilib':'Ödənilməyib'}</span></td>
      </tr>`;
    }
    if(m.index===curIdx){
      return `<tr style="background:rgba(184,134,63,.09);">
        <td style="font-weight:600;">${esc(m.label)}</td><td class="num" style="font-weight:600;">${fmtMoney(monthly)}</td><td class="num" style="font-weight:600;">${fmtMoney(faktiki)}</td>
        <td><span class="tag" style="background:var(--accent);color:#2A1D08;">Cari ay</span></td>
      </tr>`;
    }
    return `<tr class="muted" style="opacity:.6;">
      <td>${esc(m.label)}</td><td class="num">${fmtMoney(monthly)}</td><td class="num">—</td><td>Gələcək</td>
    </tr>`;
  }).join('');
}

async function recordQuickPayment(contractId){
  const errEl=document.getElementById('qp-err');
  errEl.style.display='none';
  const contract=byId(state.contracts,contractId);
  if(!contract) return;
  const amount=Number(document.getElementById('qp-amount').value);
  const date=document.getElementById('qp-date').value;
  const isReturn=document.getElementById('qp-return').checked;
  if(!amount || amount<=0){ errEl.textContent='Məbləği düzgün daxil edin.'; errEl.style.display='block'; return; }
  if(!date){ errEl.textContent='Tarixi seçin.'; errEl.style.display='block'; return; }
  if(isReturn){
    const netSale=contractNetSale(contract);
    if(amount>netSale+0.01 && !confirm('Geri qaytarılan məbləğ ('+fmtMoney(amount)+') müqavilənin qalan satış məbləğindən ('+fmtMoney(netSale)+') çoxdur. Davam edilsin?')){
      errEl.textContent='Əməliyyat yadda saxlanmadı (təsdiqləmədiniz).'; errEl.style.display='block'; return;
    }
  }
  const curIdx=currentScheduleIndex(contract);
  const months=scheduleMonths(contract);
  const curMonth=months.find(m=>m.index===curIdx);
  try{
    const saved=await apiAdd('payments', {
      contractId:contract.id, meblag:isReturn?-amount:amount, odemeTarixi:date, collectorId:'',
      qeyd:'', qrafikAyIndex:curIdx, qrafikAyLabel:curMonth?curMonth.label:'',
      emeliyyatNovu:isReturn?'Geri qaytarma':'Ödəniş',
    });
    upsertInState('payments', saved);
    const cid=saved.contractId, amt=Number(saved.meblag)||0;
    if(isReturnPayment(saved)){
      returnSums[cid]=(Number(returnSums[cid])||0)+Math.abs(amt);
    } else {
      paymentSums[cid]=(Number(paymentSums[cid])||0)+amt;
      if(amt>0 && (!paymentLast[cid] || date>paymentLast[cid])) paymentLast[cid]=date;
      if(date.slice(0,7)===currentYm()) dashMonthTotal+=amt;
    }
    renderScreen();
  }catch(err){
    errEl.textContent='Yadda saxlanmadı: '+err.message;
    errEl.style.display='block';
  }
}

      <tbody id="reassign-tbody">${renderReassignRows(role)}</tbody>
    </table></div></div>
  `);
  const input=document.getElementById('reassign-search');
  const results=document.getElementById('reassign-results');
  function matchesFor(q){
    const query=(q||'').toLowerCase();
    if(query.length<3) return [];
    return state.contracts.filter(c=>{
      const cust=byId(state.customers,c.customerId);
      return (c.nomre+' '+(cust?fullName(cust):'')).toLowerCase().includes(query);
    }).slice(0,30);
  }
  function renderList(q){
    if((q||'').length<3){ results.innerHTML=`<div class="search-item muted">Ən azı 3 simvol yazın…</div>`; results.style.display='block'; return; }
    const matches=matchesFor(q);
    results.innerHTML = matches.length
      ? matches.map(c=>`<div class="search-item" data-id="${c.id}">${esc(c.nomre)} — ${esc(customerName(c.customerId))}</div>`).join('')
      : `<div class="search-item muted">Nəticə tapılmadı</div>`;
    results.style.display = 'block';
  }
  input.addEventListener('input', ()=>renderList(input.value));
  input.addEventListener('focus', ()=>renderList(input.value));
  input.addEventListener('blur', ()=>{ setTimeout(()=>{ results.style.display='none'; }, 150); });
  input.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){
      e.preventDefault();
      const matches=matchesFor(input.value);
      if(matches.length){ addReassignContract(role, matches[0].id); input.value=''; results.style.display='none'; }

  results.addEventListener('mousedown', (e)=>{
    const item=e.target.closest('.search-item[data-id]');
    if(!item) return;
    addReassignContract(role, item.dataset.id);
    input.value=''; results.style.display='none';
  });
}

function addReassignContract(role, contractId){
  if(!reassignIds[role].includes(contractId)) reassignIds[role].push(contractId);
  document.getElementById('reassign-tbody').innerHTML=renderReassignRows(role);

function removeReassignContract(role, contractId){
  reassignIds[role]=reassignIds[role].filter(id=>id!==contractId);

function renderReassignRows(role){
  if(!reassignIds[role].length) return `<tr><td colspan="7" class="empty">Hələ müqavilə əlavə olunmayıb</td></tr>`;

async function applyReassign(role){
  role=role||'collector';
  const R=ROLES[role];
  const errEl=document.getElementById('reassign-err');
  errEl.style.display='none';
  const newId=document.getElementById('reassign-assignee').value;
  if(!newId){ errEl.textContent='Yeni '+R.lower+' seçin.'; errEl.style.display='block'; return; }
  if(!reassignIds[role].length){ errEl.textContent='Siyahıya ən azı bir müqavilə əlavə edin.'; errEl.style.display='block'; return; }
  const today=todayIso();
  let sameCount=0;
  try{
    for(const id of reassignIds[role]){
      const c=byId(state.contracts,id);
      if(!c) continue;
      if(activeAssigneeId(c,role)===newId) sameCount++;
      const list=(c[R.field]||[]).map(a=>a.son?a:{...a,son:today});
      list.push({[R.idKey]:newId, baslama:today, son:''});
      const saved=await apiUpdate('contracts', c.id, {[R.field]:list});
      upsertInState('contracts', saved);
    }
    reassignIds[role]=[];
    renderScreen();
    if(sameCount>0) alert(sameCount+' müqavilədə '+R.lower+' artıq eyni idi, amma yenə də yeni təyinat yaradıldı.');
  }catch(err){
    errEl.textContent='Xəta: '+err.message;
    errEl.style.display='block';
  }
}

/* ---- Hesabat 1: Gecikmiş müqavilələr ----
   Gecikmə = ən son (real) ödəniş tarixi ilə bu gün arasında tam ay fərqi.
   Heç ödənişi olmayan müqavilədə müqavilə tarixi əsas götürülür.
   Yalnız hələ borcu qalan müqavilələr gecikmiş sayılır. */
const OVERDUE_MIN_MONTHS=2;
const OVERDUE_PAGE_SIZE=50;
let overdueBase=[];
let overdueFilters={};
function resetOverdueFilters(){
  overdueFilters={nomre:'',musteri:'',tel:'',satici:'',tehsilatci:'',kurator:'',tarixDan:'',tarixDek:'',
    satisMin:'',satisMax:'',borcMin:'',borcMax:'',qrafikMin:'',gecMin:'',gecMax:''};
}
resetOverdueFilters();

function monthsSince(iso, today){
  const f=new Date(iso+'T00:00:00');
  if(isNaN(f)) return 0;
  let m=(today.getFullYear()-f.getFullYear())*12 + (today.getMonth()-f.getMonth());
  if(today.getDate()<f.getDate()) m--;
  return Math.max(0,m);
}

function buildOverdueBase(){
  const today=new Date(); today.setHours(0,0,0,0);
  const mk=arr=>{ const m=new Map(); arr.forEach(x=>m.set(x.id,x)); return m; };
  const cust=mk(state.customers), sp=mk(state.salespeople), col=mk(state.collectors), cur=mk(state.curators);
  const nm=(m,id)=>{ const o=m.get(id); return o?fullName(o):'—'; };
  const rows=[];
  for(const c of state.contracts){
    const debt=contractDebt(c);
    if(debt<=0.009) continue;
    const lastIso=paymentLast[c.id]||c.tarix;
    if(!lastIso) continue;
    const months=monthsSince(lastIso,today);
    if(months<OVERDUE_MIN_MONTHS) continue;
    const cu=cust.get(c.customerId);
    const collectorId=activeCollectorForContract(c)||'';
    const curatorId=activeCuratorForContract(c)||'';
    const phones=cu?[cu.elaqeNomre1,cu.elaqeNomre2].filter(Boolean):[];
    rows.push({
      c, customer:cu?fullName(cu):'—', phone:phones.join(', '), phoneDigits:phones.join('').replace(/\D/g,''),
      salesperson:nm(sp,c.salespersonId),
      collectorId, collector:collectorId?nm(col,collectorId):'—',
      curatorId, curator:curatorId?nm(cur,curatorId):'—',
      sale:Number(c.meblag)||0, debt, scheduleDebt:contractScheduleDebt(c),
      lastIso:paymentLast[c.id]||'', months,
    });
  }
  rows.sort((a,b)=>b.months-a.months || b.debt-a.debt);
  return rows;
}

function filterOverdue(rows, f){
  const lc=v=>(v||'').toString().toLowerCase();
  const num=v=>(v===''||v==null||isNaN(Number(v)))?null:Number(v);
  const tel=(f.tel||'').replace(/\D/g,'');
  const nomre=lc(f.nomre), musteri=lc(f.musteri);
  const sMin=num(f.satisMin), sMax=num(f.satisMax), bMin=num(f.borcMin), bMax=num(f.borcMax);
  const qMin=num(f.qrafikMin), gMin=num(f.gecMin), gMax=num(f.gecMax);
  const eps=0.0001;
  const assigneeOk=(sel,id)=> !sel || (sel==='__none__' ? !id : id===sel);
  return rows.filter(r=>{
    if(nomre && !lc(r.c.nomre).includes(nomre)) return false;
    if(musteri && !lc(r.customer).includes(musteri)) return false;
    if(tel && !r.phoneDigits.includes(tel)) return false;
    if(f.satici && r.c.salespersonId!==f.satici) return false;
    if(!assigneeOk(f.tehsilatci,r.collectorId)) return false;
    if(!assigneeOk(f.kurator,r.curatorId)) return false;
    if(f.tarixDan && (r.c.tarix||'')<f.tarixDan) return false;
    if(f.tarixDek && (r.c.tarix||'')>f.tarixDek) return false;
    if(sMin!=null && r.sale<sMin-eps) return false;
    if(sMax!=null && r.sale>sMax+eps) return false;
    if(bMin!=null && r.debt<bMin-eps) return false;
    if(bMax!=null && r.debt>bMax+eps) return false;
    if(qMin!=null && r.scheduleDebt<qMin-eps) return false;
    if(gMin!=null && r.months<gMin) return false;
    if(gMax!=null && r.months>gMax) return false;
    return true;
  });
}

function overdueRowHtml(r){
  return `<tr>
    <td>${esc(r.c.nomre)}</td>
    <td>${fmtDate(r.c.tarix)}</td>
    <td>${esc(r.customer)}</td>
    <td class="muted">${esc(r.phone||'—')}</td>
    <td class="muted">${esc(r.salesperson)}</td>
    <td class="muted">${esc(r.collector)}</td>
    <td class="muted">${esc(r.curator)}</td>
    <td class="num">${fmtMoney(r.sale)}</td>
    <td class="num"><span class="tag tag-red">${fmtMoney(r.debt)}</span></td>
    <td class="num">${fmtMoney(r.scheduleDebt)}</td>
    <td>${r.lastIso?fmtDate(r.lastIso):'<span class="muted">Ödəniş yoxdur</span>'}</td>
    <td class="num"><span class="tag tag-red">${r.months} ay</span></td>
  </tr>`;
}

function refreshOverdueTable(){
  const tbody=document.getElementById('overdue-tbody');
  if(!tbody) return;
  const rows=filterOverdue(overdueBase, overdueFilters);
  const {pageRows, totalPages, total}=paginateArr(rows,'report-overdue',OVERDUE_PAGE_SIZE);
  const sumDebt=rows.reduce((a,r)=>a+r.debt,0), sumSch=rows.reduce((a,r)=>a+r.scheduleDebt,0);
  document.getElementById('overdue-summary').innerHTML=
    `<strong>${total}</strong> müqavilə &nbsp;·&nbsp; Cəmi cari borc: <strong>${fmtMoney(sumDebt)}</strong> &nbsp;·&nbsp; Cəmi qrafik üzrə borc: <strong>${fmtMoney(sumSch)}</strong>`;
  tbody.innerHTML=pageRows.length?pageRows.map(overdueRowHtml).join(''):`<tr><td colspan="12" class="empty" style="padding:40px;">Nəticə tapılmadı</td></tr>`;
  document.getElementById('pagination-report-overdue').innerHTML=paginationHtml('report-overdue',totalPages,total);
}

async function withButtonLoading(btn, fn){
  if(!btn) return fn();
  const prevDisabled=btn.disabled;
  btn.disabled=true;
  btn.style.opacity='.6';
  btn.style.cursor='not-allowed';
  try{
    return await fn();
  } finally {
    btn.disabled=prevDisabled;
    btn.style.opacity='';
    btn.style.cursor='';
  }
}

/* ============ API LAYER (PHP backend: api.php) ============ */
const API_BASE='api.php?col=';
async function readErr(r, fallback){
  try{ const j=await r.json(); if(j&&j.error) return j.error; }catch(e){}
  return fallback;
}
async function apiList(col){
  const r=await fetch(API_BASE+col);
  if(!r.ok) throw new Error(await readErr(r,'Yükləmə xətası ('+col+')'));
  return r.json();
}
async function apiPaymentSums(){
  const r=await fetch(API_BASE+'payments&agg=sum');
  if(!r.ok) throw new Error(await readErr(r,'Yükləmə xətası (ödəniş cəmləri)'));
  return r.json();
}
async function apiPaymentLast(){
  const r=await fetch(API_BASE+'payments&agg=last');
  if(!r.ok) throw new Error(await readErr(r,'Yükləmə xətası (son ödəniş tarixləri)'));
  return r.json();
}
async function apiMonthSum(ym){
  const r=await fetch(API_BASE+'payments&agg=month&ym='+encodeURIComponent(ym));
  if(!r.ok) throw new Error(await readErr(r,'Yükləmə xətası (aylıq cəm)'));
  const j=await r.json();
  return Number(j.total)||0;
}
async function apiPaymentsForContract(contractId){
  const r=await fetch(API_BASE+'payments&contractId='+encodeURIComponent(contractId));
  if(!r.ok) throw new Error(await readErr(r,'Yükləmə xətası (ödənişlər)'));
  return r.json();
}
async function apiAdd(col,data){
  const r=await fetch(API_BASE+col,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  if(!r.ok) throw new Error(await readErr(r,'Əlavə etmə xətası ('+col+')'));
  return r.json();
}
async function apiUpdate(col,id,data){
  const r=await fetch(API_BASE+col+'&id='+encodeURIComponent(id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  if(!r.ok) throw new Error(await readErr(r,'Yeniləmə xətası ('+col+')'));
  return r.json();
}
async function apiDelete(col,id){
  const r=await fetch(API_BASE+col+'&id='+encodeURIComponent(id),{method:'DELETE'});
  if(!r.ok) throw new Error(await readErr(r,'Silmə xətası ('+col+')'));
  return r.json();
}
