<script>
/* ============ ICONS ============ */
const ICONS = {
  dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="9" rx="1.3"/><rect x="14" y="3" width="7" height="5" rx="1.3"/><rect x="14" y="12" width="7" height="9" rx="1.3"/><rect x="3" y="16" width="7" height="5" rx="1.3"/></svg>',

  payment:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2.5" y="6" width="19" height="13" rx="2"/><path d="M2.5 10.5h19"/><circle cx="7" cy="14.7" r="1.2" fill="currentColor" stroke="none"/></svg>',
  reassign:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>',
  inquiry:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/><path d="M8.2 10.5h4.6M10.5 8.2v4.6"/></svg>',
  calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 3v4M16 3v4"/><path d="M8.5 14l1.8 1.8L13.5 12.3"/></svg>',
  reports:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20V10M11 20V4M18 20v-7"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2m2 0l-1 13a1 1 0 01-1 1H8a1 1 0 01-1-1L6 7"/></svg>',
};
const AZ_MONTHS=['Yanvar','Fevral','Mart','Aprel','May','İyun','İyul','Avqust','Sentyabr','Oktyabr','Noyabr','Dekabr'];

/* ============ STATE ============ */
const state={salespeople:[],collectors:[],customers:[],contracts:[],payments:[]};
let paymentSums={}; // müqavilə id -> ödənişlərin cəmi (yüngül, tam sətirlər olmadan)
function upsertInState(col, item){
  if(!state[col] || !item || !item.id) return;
  const idx=state[col].findIndex(x=>x.id===item.id);
  if(idx>=0) state[col][idx]=item; else state[col].push(item);
}
function removeFromState(col, id){
  if(!state[col]) return;
  state[col]=state[col].filter(x=>x.id!==id);
}
let currentScreen='contracts';

const SCREENS=[
  {id:'dashboard',label:'İdarə paneli',icon:'dashboard'},
  {id:'salespeople',label:'Satıcılar',icon:'sales'},
  {id:'collectors',label:'Təhsilatçılar',icon:'collector'},
  {id:'customers',label:'Müştərilər',icon:'customers'},
  {id:'contracts',label:'Müqavilələr',icon:'contract'},
  {id:'payments',label:'Ödənişlər',icon:'payment'},
  {id:'reassign',label:'Təhsilatçı dəyişikliyi',icon:'reassign'},
  {id:'debt-inquiry',label:'Müştəri borc sorğusu',icon:'inquiry'},
  {id:'reports',label:'Hesabatlar',icon:'reports'},
];

/* ============ HELPERS ============ */
function fmtMoney(n){ n=Number(n)||0; return n.toLocaleString('az-AZ',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₼'; }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear(); }
function esc(s){ return (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fullName(o){ if(!o) return ''; return [o.soyad,o.ad,o.ataAdi].filter(Boolean).join(' '); }
function byId(arr,id){ return arr.find(x=>x.id===id); }
function phonesToArr(str){ return (str||'').split(',').map(s=>s.trim()).filter(Boolean); }

function customerName(id){ const c=byId(state.customers,id); return c?fullName(c):'—'; }
function salespersonName(id){ const s=byId(state.salespeople,id); return s?fullName(s):'—'; }
function collectorName(id){ const c=byId(state.collectors,id); return c?fullName(c):'—'; }

function scheduleMonths(contract){
  const out=[]; if(!contract.tarix||!contract.muddet) return out;
  const start=new Date(contract.tarix+'T00:00:00');
  for(let i=1;i<=Number(contract.muddet);i++){
    const d=new Date(start.getFullYear(), start.getMonth()+i, 1);
    out.push({index:i,label:'Ay '+i+' — '+AZ_MONTHS[d.getMonth()]+' '+d.getFullYear(),date:d});
  }
  return out;
}
function contractPaidSum(contractId){
  if(Object.prototype.hasOwnProperty.call(paymentSums, contractId)) return Number(paymentSums[contractId])||0;
  if(state.payments && state.payments.length) return state.payments.filter(p=>p.contractId===contractId).reduce((s,p)=>s+(Number(p.meblag)||0),0);
  return 0;
}
function contractDebt(contract){
  return (Number(contract.meblag)||0) - (Number(contract.ilkinOdenis)||0) - contractPaidSum(contract.id);
}
function currentCollectorForContract(contract,onDate){
  const d=onDate?new Date(onDate):new Date();
  const list=contract.tehsilatciTeyinatlari||[];
  const hit=list.find(a=>{
    const s=a.baslama?new Date(a.baslama):null;
    const e=a.son?new Date(a.son):null;
    return (!s||d>=s)&&(!e||d<=e);
  });
  return hit?hit.collectorId:(list.length?list[list.length-1].collectorId:null);
}
// Müqavilələr siyahısında göstərilən təhsilatçı: "Son" xanası boş olan təyinat (davam edən təyinat)
function activeCollectorForContract(contract){
  const list=contract.tehsilatciTeyinatlari||[];
  const hit=list.find(a=>!a.son);
  return hit?hit.collectorId:(list.length?list[list.length-1].collectorId:null);
}

/* ============ RENDER SHELL ============ */
function renderNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML=SCREENS.map(s=>
    `<button class="navbtn${s.id===currentScreen?' active':''}" data-action="nav" data-screen="${s.id}">${ICONS[s.icon]}<span>${s.label}</span></button>`
  ).join('');
}
function setContent(html){ document.getElementById('content').innerHTML=html; }

// Hər ekranın faktiki ehtiyac duyduğu cədvəllər (ad/borc kimi hesablanan
// sahələr üçün başqa cədvəllərə də baxmaq lazım ola bilər).
const SCREEN_DEPS={
  dashboard:['contracts','paymentSums','customers'],
  salespeople:['salespeople'],
  collectors:['collectors'],
  customers:['customers'],
  contracts:['contracts','customers','salespeople','collectors','paymentSums'],
  payments:['contracts','customers','collectors','payments'],
  reassign:['contracts','customers','collectors','paymentSums'],
  'debt-inquiry':['customers','contracts','collectors','paymentSums'],
  reports:[],
};
const loadedCols=new Set();
async function ensureLoaded(cols){
  const need=cols.filter(c=>!loadedCols.has(c));
  if(!need.length) return;
  const promises=need.map(c=> c==='paymentSums' ? apiPaymentSums() : apiList(c));
  const results=await Promise.all(promises);
  need.forEach((c,i)=>{
    if(c==='paymentSums'){ paymentSums=results[i]; } else { state[c]=results[i]; }
    loadedCols.add(c);
  });
}

async function renderScreen(){
  renderNav();
  const deps=SCREEN_DEPS[currentScreen]||[];
  const needFetch=deps.some(c=>!loadedCols.has(c));
  if(needFetch){
    setContent(`<div class="topbar"><div><h1>Yüklənir…</h1><div class="sub">Məlumat gətirilir</div></div></div>`);
    try{
      await ensureLoaded(deps);
    }catch(err){
      setContent(`<div class="topbar"><div><h1>Serverlə əlaqə qurulmadı</h1></div></div><div class="banner">${esc(err.message)}. Səhifəni yeniləyin (F5).</div>`);
      return;
    }
  }
  switch(currentScreen){
    case 'dashboard': return renderDashboard();
    case 'salespeople': return renderSimpleList('salespeople');
    case 'collectors': return renderSimpleList('collectors');
    case 'customers': return renderCustomers();

function clearFieldErrors(form){
  form.querySelectorAll('.field-err').forEach(e=>{ e.textContent=''; e.style.display='none'; });
  form.querySelectorAll('.input-error').forEach(e=>e.classList.remove('input-error'));
}
function setFieldError(form, name, msg){
  const input=form.querySelector(`[name="${name}"]`);
  if(input) input.classList.add('input-error');
  const errEl=form.querySelector(`.field-err[data-err-for="${name}"]`);
  if(errEl){ errEl.textContent=msg; errEl.style.display='block'; }
}
function isDuplicate(list, field, value, excludeId){
  if(!value) return false;
  const v=value.trim().toLowerCase();
  return list.some(item=>item.id!==excludeId && (item[field]||'').toString().trim().toLowerCase()===v);
}
function calcAge(dateStr){
  const b=new Date(dateStr+'T00:00:00');
  if(isNaN(b)) return null;
  const now=new Date();
  let age=now.getFullYear()-b.getFullYear();
  const mDiff=now.getMonth()-b.getMonth();
  if(mDiff<0 || (mDiff===0 && now.getDate()<b.getDate())) age--;
  return age;
}
function bindDigitsOnly(form){
  ['elaqeNomre1','elaqeNomre2'].forEach(n=>{
    const el=form.querySelector(`[name="${n}"]`);
    if(el) el.addEventListener('input', ()=>{ el.value=el.value.replace(/\D/g,'').slice(0,9); });
  });
}

const PAGE_SIZE=20;
const pageNum={salespeople:1,collectors:1,customers:1,contracts:1};
function paginateArr(array, key){
  const total=array.length;
  const totalPages=Math.max(1, Math.ceil(total/PAGE_SIZE));
  if(pageNum[key]>totalPages) pageNum[key]=totalPages;
  if(pageNum[key]<1) pageNum[key]=1;
  const start=(pageNum[key]-1)*PAGE_SIZE;
  return {pageRows:array.slice(start,start+PAGE_SIZE), totalPages, total};
}
function paginationHtml(key, totalPages, total){
  if(total===0) return '';
  return `<div class="pagination" style="display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px;">
    <span class="muted" style="font-size:12.5px;">${total} nəticə</span>

    <span class="muted" style="font-size:12.5px;">Səhifə ${pageNum[key]} / ${totalPages}</span>
    <button class="btn btn-ghost btn-sm" data-action="page-next" data-key="${key}" ${pageNum[key]>=totalPages?'disabled':''}>Növbəti ›</button>

/* ============ PAYMENTS ============ */
let paymentsContractId=null;

function scheduleDueCount(contract){
  const months=scheduleMonths(contract);
  const today=new Date(); today.setHours(0,0,0,0);
  let due=0;
  for(const m of months){ if(m.date<=today) due=m.index; else break; }
  return due;
}
function currentScheduleIndex(contract){
  const due=scheduleDueCount(contract);
  const muddet=Number(contract.muddet)||1;
  return Math.min(Math.max(due,1), muddet);
}
function todayIso(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

  const meblag=Number(contract.meblag)||0;

  const months=scheduleMonths(contract);
  const curIdx=currentScheduleIndex(contract);
  const monthly=contract.muddet?((meblag-ilkin)/Number(contract.muddet)):0;
  return months.map(m=>{
    const faktiki=state.payments.filter(p=>p.contractId===contract.id && Number(p.qrafikAyIndex)===m.index).reduce((s,p)=>s+(Number(p.meblag)||0),0);
    if(m.index<curIdx){
      const ok=faktiki>=monthly-0.01;
      return `<tr class="muted">
        <td>${esc(m.label)}</td><td class="num">${fmtMoney(monthly)}</td><td class="num">${fmtMoney(faktiki)}</td>
        <td><span class="tag ${ok?'tag-green':'tag-red'}">${ok?'Ödənilib':'Ödənilməyib'}</span></td>
      </tr>`;

    if(m.index===curIdx){
      return `<tr style="background:rgba(184,134,63,.09);">
        <td style="font-weight:600;">${esc(m.label)}</td><td class="num" style="font-weight:600;">${fmtMoney(monthly)}</td><td class="num" style="font-weight:600;">${fmtMoney(faktiki)}</td>
        <td><span class="tag" style="background:var(--accent);color:#2A1D08;">Cari ay</span></td>
      </tr>`;
    }
    return `<tr class="muted" style="opacity:.6;">
      <td>${esc(m.label)}</td><td class="num">${fmtMoney(monthly)}</td><td class="num">—</td><td>Gələcək</td>
    </tr>`;
  }).join('');
}

async function recordQuickPayment(contractId){
  const errEl=document.getElementById('qp-err');
  errEl.style.display='none';
  const contract=byId(state.contracts,contractId);
  if(!contract) return;
  const amount=Number(document.getElementById('qp-amount').value);
  const date=document.getElementById('qp-date').value;
  const collectorId=document.getElementById('qp-collector').value;
  if(!amount || amount<=0){ errEl.textContent='Məbləği düzgün daxil edin.'; errEl.style.display='block'; return; }
  if(!date){ errEl.textContent='Tarixi seçin.'; errEl.style.display='block'; return; }
  if(!collectorId){ errEl.textContent='Təhsilatçı seçin.'; errEl.style.display='block'; return; }
  const curIdx=currentScheduleIndex(contract);
  const months=scheduleMonths(contract);
  const curMonth=months.find(m=>m.index===curIdx);
  const activeCollector=activeCollectorForContract(contract);
  if(activeCollector && collectorId!==activeCollector){
    const proceed=confirm(contract.nomre+' nömrəli müqavilədəki təhsilatçı ilə ödənişdəki təhsilatçı fərqlənir. Davam edilsin?');
    if(!proceed){ errEl.textContent='Ödəniş yadda saxlanmadı (təsdiqləmədiniz).'; errEl.style.display='block'; return; }
  }
  try{
    const saved=await apiAdd('payments', {
      contractId:contract.id, meblag:amount, odemeTarixi:date, collectorId,
      qeyd:'', qrafikAyIndex:curIdx, qrafikAyLabel:curMonth?curMonth.label:'',
    });
    upsertInState('payments', saved);
    paymentSums[saved.contractId]=(Number(paymentSums[saved.contractId])||0)+(Number(saved.meblag)||0);
    renderScreen();
  }catch(err){
    errEl.textContent='Yadda saxlanmadı: '+err.message;
    errEl.style.display='block';
  }
}

  function matchesFor(q){
    const query=(q||'').toLowerCase();
    if(query.length<3) return [];
    return state.contracts.filter(c=>{
      const cust=byId(state.customers,c.customerId);
      return (c.nomre+' '+(cust?fullName(cust):'')).toLowerCase().includes(query);
    }).slice(0,30);
  }
  function renderList(q){
    if((q||'').length<3){ results.innerHTML=`<div class="search-item muted">Ən azı 3 simvol yazın…</div>`; results.style.display='block'; return; }
    const matches=matchesFor(q);
    results.innerHTML = matches.length
      ? matches.map(c=>`<div class="search-item" data-id="${c.id}">${esc(c.nomre)} — ${esc(customerName(c.customerId))}</div>`).join('')
      : `<div class="search-item muted">Nəticə tapılmadı</div>`;
    results.style.display = 'block';
  }
  input.addEventListener('input', ()=>renderList(input.value));
  input.addEventListener('focus', ()=>renderList(input.value));
  input.addEventListener('blur', ()=>{ setTimeout(()=>{ results.style.display='none'; }, 150); });
  input.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){
      e.preventDefault();
      const matches=matchesFor(input.value);
      if(matches.length){ addReassignContract(matches[0].id); input.value=''; results.style.display='none'; }
    }
  });
  results.addEventListener('mousedown', (e)=>{
    const item=e.target.closest('.search-item[data-id]');
    if(!item) return;
    addReassignContract(item.dataset.id);
    input.value=''; results.style.display='none';
  });
}

function addReassignContract(contractId){
  if(!reassignContractIds.includes(contractId)) reassignContractIds.push(contractId);
  document.getElementById('reassign-tbody').innerHTML=renderReassignRows();
}
function removeReassignContract(contractId){
  reassignContractIds=reassignContractIds.filter(id=>id!==contractId);
  document.getElementById('reassign-tbody').innerHTML=renderReassignRows();
}
function renderReassignRows(){
  if(!reassignContractIds.length) return `<tr><td colspan="7" class="empty">Hələ müqavilə əlavə olunmayıb</td></tr>`;
  return reassignContractIds.map(id=>{
    const c=byId(state.contracts,id);
    if(!c) return '';
    const monthlyBase=c.muddet?((Number(c.meblag)-Number(c.ilkinOdenis||0))/Number(c.muddet)):0;
    const dueCount=scheduleDueCount(c);
    const scheduleDebt=Math.max(0, monthlyBase*dueCount - contractPaidSum(c.id));
    const curCollector=activeCollectorForContract(c);
    return `<tr>
      <td>${esc(c.nomre)}</td>
      <td>${esc(customerName(c.customerId))}</td>
      <td class="num">${fmtMoney(c.meblag)}</td>
      <td class="num">${fmtMoney(contractDebt(c))}</td>
      <td class="num">${fmtMoney(scheduleDebt)}</td>
      <td class="muted">${esc(collectorName(curCollector))}</td>
      <td><button class="iconbtn" data-action="remove-reassign" data-id="${c.id}" title="Siyahıdan çıxar">${ICONS.trash}</button></td>
    </tr>`;
  }).join('');
}

async function applyReassign(){
  const errEl=document.getElementById('reassign-err');
  errEl.style.display='none';
  const newCollectorId=document.getElementById('reassign-collector').value;
  if(!newCollectorId){ errEl.textContent='Yeni təhsilatçı seçin.'; errEl.style.display='block'; return; }
  if(!reassignContractIds.length){ errEl.textContent='Siyahıya ən azı bir müqavilə əlavə edin.'; errEl.style.display='block'; return; }
  const today=todayIso();
  let sameCount=0;
  try{
    for(const id of reassignContractIds){
      const c=byId(state.contracts,id);
      if(!c) continue;
      const curCollector=activeCollectorForContract(c);
      if(curCollector===newCollectorId) sameCount++;
      const list=(c.tehsilatciTeyinatlari||[]).map(a=>a.son?a:{...a,son:today});
      list.push({collectorId:newCollectorId, baslama:today, son:''});
      const saved=await apiUpdate('contracts', c.id, {tehsilatciTeyinatlari:list});
      upsertInState('contracts', saved);
    }
    reassignContractIds=[];
    renderScreen();
    if(sameCount>0) alert(sameCount+' müqavilədə təhsilatçı artıq eyni idi, amma yenə də yeni təyinat yaradıldı.');
  }catch(err){
    errEl.textContent='Xəta: '+err.message;
    errEl.style.display='block';
  }
}

/* ============ CUSTOMER DEBT INQUIRY (Müştəri borc sorğusu) ============ */
let debtInquiryQuery='';
let debtInquirySelectedId=null;

function findDebtInquiryMatches(query){
  const q=query.trim().toLowerCase();
  if(!q) return [];
  const finMatch=state.customers.filter(c=>(c.finKod||'').trim().toLowerCase()===q);
  if(finMatch.length) return finMatch;
  return state.customers.filter(c=>fullName(c).toLowerCase().includes(q));
}

function renderDebtInquiry(){
  const query=debtInquiryQuery;
  const matches=query?findDebtInquiryMatches(query):[];
  let customer=null;
  if(matches.length===1){ customer=matches[0]; }
  else if(matches.length>1 && debtInquirySelectedId){ customer=matches.find(c=>c.id===debtInquirySelectedId)||null; }

  let resultHtml='';
  if(query && matches.length===0){
    resultHtml=`<div class="banner">Bu FIN və ya adla müştəri tapılmadı.</div>`;
  } else if(matches.length>1 && !customer){
    resultHtml=`<div class="card" style="padding:16px 18px;">
      <div class="muted" style="font-size:13px;margin-bottom:10px;">${matches.length} nəticə tapıldı, birini seçin:</div>
      ${matches.map(c=>`<div class="search-item" style="position:static;padding:10px 12px;border-radius:7px;" data-action="debt-inquiry-select" data-id="${c.id}">${esc(fullName(c))}${c.finKod?' <span class="muted">— '+esc(c.finKod)+'</span>':''}</div>`).join('')}
    </div>`;
  } else if(customer){
    const contracts=state.contracts.filter(c=>c.customerId===customer.id);
    let totalDebt=0, totalScheduleDebt=0;
    const rowsHtml=contracts.map(c=>{
      const debt=contractDebt(c);
      const monthlyBase=c.muddet?((Number(c.meblag)-Number(c.ilkinOdenis||0))/Number(c.muddet)):0;
      const dueCount=scheduleDueCount(c);
      const scheduleDebt=Math.max(0, monthlyBase*dueCount - contractPaidSum(c.id));
      totalDebt+=debt; totalScheduleDebt+=scheduleDebt;
      const curCollector=activeCollectorForContract(c);
      return `<tr>
        <td>${esc(c.nomre)}</td>
        <td>${fmtDate(c.tarix)}</td>
        <td class="num">${fmtMoney(c.meblag)}</td>
        <td class="num">${fmtMoney(c.ilkinOdenis)}</td>
        <td class="num"><span class="tag ${debt>0?'tag-red':'tag-green'}">${fmtMoney(debt)}</span></td>
        <td class="num">${fmtMoney(scheduleDebt)}</td>
        <td class="muted">${esc(collectorName(curCollector))}</td>
      </tr>`;
    }).join('') || `<tr><td colspan="7" class="empty">Bu müştərinin müqaviləsi yoxdur</td></tr>`;

    resultHtml=`
      <div class="card" style="padding:16px 18px;margin-bottom:16px;">
        <div style="font-weight:600;font-size:15px;margin-bottom:6px;">${esc(fullName(customer))}</div>
        <div class="muted" style="font-size:13px;line-height:1.7;">
          Əlaqə: ${esc(customer.elaqeNomre1||'—')}${customer.elaqeNomre2?', '+esc(customer.elaqeNomre2):''}<br>
          Qeydiyyat ünvanı: ${esc(customer.qeydiyyatUnvani||'—')}<br>
          Faktiki ünvan: ${esc(customer.faktikiUnvan||'—')}
        </div>
      </div>
      <div class="kpis">
        <div class="card kpi"><div class="lbl">Ümumi qalıq borc</div><div class="val" style="color:${totalDebt>0?'var(--red)':'var(--green)'}">${fmtMoney(totalDebt)}</div></div>
        <div class="card kpi"><div class="lbl">Ümumi qrafik üzrə borc</div><div class="val" style="color:${totalScheduleDebt>0?'var(--red)':'var(--green)'}">${fmtMoney(totalScheduleDebt)}</div></div>
      </div>
      <div class="section-title">Müqavilələr</div>
      <div class="card"><div class="table-scroll"><table>
        <thead><tr><th>Müqavilə №</th><th>Tarix</th><th class="num">Satış məbləği</th><th class="num">İlkin ödəniş</th><th class="num">Qalıq borc</th><th class="num">Qrafik üzrə borc</th><th>Təhsilatçı</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table></div></div>
    `;
  }

  setContent(`
    <div class="topbar"><div><h1>Müştəri borc sorğusu</h1><div class="sub">FIN və ya Soyad Ad Ata adı ilə axtarın</div></div></div>
    <div class="card" style="padding:18px;margin-bottom:16px;max-width:460px;">
      <label>FIN və ya Soyad Ad Ata adı</label>
      <div style="display:flex;gap:8px;">
        <input type="text" id="debt-inquiry-fin" value="${esc(query)}" placeholder="FIN (7 simvol) və ya ad soyad">
        <button class="btn btn-primary" data-action="debt-inquiry-search" style="white-space:nowrap;">Axtar</button>
      </div>
    </div>
    ${resultHtml}
  `);
  const input=document.getElementById('debt-inquiry-fin');
  input.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){ e.preventDefault(); debtInquiryQuery=input.value.trim(); debtInquirySelectedId=null; renderDebtInquiry(); }
  });
  input.focus();
}

async function deleteRecord(col, id, label){

/* ============ EVENT DELEGATION ============ */
document.addEventListener('click', async (e)=>{
  const btn=e.target.closest('[data-action]');
  if(!btn) return;
  const action=btn.dataset.action, id=btn.dataset.id;
  if(action==='nav'){ currentScreen=btn.dataset.screen; renderScreen(); return; }
  if(action==='manual-refresh'){
    const label=btn.querySelector('span');
    const oldText=label.textContent;
    label.textContent='Yenilənir…';
    btn.disabled=true;
    try{ loadedCols.clear(); await renderScreen(); } finally { label.textContent=oldText; btn.disabled=false; }
    return;
  }
  if(action==='close-modal'){ closeModal(); return; }
  if(action==='add-salespeople'){ openSimpleForm('salespeople'); return; }
  if(action==='edit-salespeople'){ openSimpleForm('salespeople', id); return; }
  if(action==='delete-salespeople'){ await withButtonLoading(btn, ()=>deleteRecord('salespeople', id, 'satıcı')); return; }
  if(action==='add-collectors'){ openSimpleForm('collectors'); return; }
  if(action==='edit-collectors'){ openSimpleForm('collectors', id); return; }
  if(action==='delete-collectors'){ await withButtonLoading(btn, ()=>deleteRecord('collectors', id, 'təhsilatçı')); return; }
  if(action==='add-customers'){ openCustomerForm(); return; }
  if(action==='edit-customers'){ openCustomerForm(id); return; }
  if(action==='delete-customers'){ await withButtonLoading(btn, ()=>deleteRecord('customers', id, 'müştəri')); return; }
  if(action==='add-contracts'){ openContractForm(); return; }
  if(action==='edit-contracts'){ openContractForm(id); return; }
  if(action==='delete-contracts'){ await withButtonLoading(btn, ()=>deleteRecord('contracts', id, 'müqavilə')); return; }
  if(action==='pay-change-contract'){ paymentsContractId=null; renderPayments(); return; }
  if(action==='record-payment'){ await withButtonLoading(btn, ()=>recordQuickPayment(btn.dataset.contractId)); return; }
  if(action==='remove-reassign'){ removeReassignContract(id); return; }
  if(action==='apply-reassign'){ await withButtonLoading(btn, ()=>applyReassign()); return; }
  if(action==='page-prev' || action==='page-next'){
    const key=btn.dataset.key;
    pageNum[key]=(pageNum[key]||1)+(action==='page-prev'?-1:1);
    const searchInput=document.getElementById('search-'+key);
    const rawVal=searchInput?searchInput.value:'';
    const q=rawVal.length>=3 ? rawVal.toLowerCase() : '';
    let rows;
    if(key==='salespeople'||key==='collectors'){
      rows=state[key].filter(p=>!q || (p.kod+p.soyad+p.ad+p.ataAdi+(p.finKod||'')+(p.elaqeNomre1||'')).toLowerCase().includes(q));
    } else if(key==='customers'){
      rows=state.customers.filter(c=>!q || (fullName(c)+' '+(c.kod||'')+' '+(c.finKod||'')+' '+(c.elaqeNomre1||'')).toLowerCase().includes(q));
    } else if(key==='contracts'){
      rows=state.contracts.filter(c=>!q || (c.nomre+' '+customerName(c.customerId)).toLowerCase().includes(q));
    } else { return; }
    const {pageRows, totalPages, total}=paginateArr(rows, key);
    if(key==='customers'){ document.getElementById('tbody-customers').innerHTML=renderCustomerRows(pageRows); }
    else if(key==='contracts'){ document.getElementById('tbody-contracts').innerHTML=renderContractRows(pageRows); }
    else { document.getElementById('tbody-'+key).innerHTML=renderSimpleRows(key, pageRows); }
    document.getElementById('pagination-'+key).innerHTML=paginationHtml(key, totalPages, total);
    return;
  }
  if(action==='debt-inquiry-search'){ debtInquiryQuery=document.getElementById('debt-inquiry-fin').value.trim(); debtInquirySelectedId=null; renderDebtInquiry(); return; }
  if(action==='debt-inquiry-select'){ debtInquirySelectedId=id; renderDebtInquiry(); return; }
  if(action==='show-assignments'){ openAssignmentsInfo(id); return; }
  if(action==='show-schedule'){ openScheduleModal(id); return; }
});
async function withButtonLoading(btn, fn){
  if(!btn) return fn();
  const prevDisabled=btn.disabled;
  btn.disabled=true;
  btn.style.opacity='.6';
  btn.style.cursor='not-allowed';
  try{
    return await fn();
  } finally {
    btn.disabled=prevDisabled;
    btn.style.opacity='';
    btn.style.cursor='';
  }
}
document.addEventListener('submit', async (e)=>{
  const submitBtn=e.target.querySelector('button[type="submit"]');
  if(e.target.id==='simple-form'){ e.preventDefault(); await withButtonLoading(submitBtn, ()=>submitSimpleForm(e.target)); }
  if(e.target.id==='customer-form'){ e.preventDefault(); await withButtonLoading(submitBtn, ()=>submitCustomerForm(e.target)); }
  if(e.target.id==='contract-form'){ e.preventDefault(); await withButtonLoading(submitBtn, ()=>submitContractForm(e.target)); }
});
document.addEventListener('input', (e)=>{
  const map={'search-salespeople':'salespeople','search-collectors':'collectors','search-customers':'customers','search-contracts':'contracts'};
  const key=map[e.target.id];
  if(!key) return;
  const val=e.target.value;
  const q=val.length>=3 ? val.toLowerCase() : '';
  if(key==='salespeople'||key==='collectors'){
    const rows=state[key].filter(p=>!q || (p.kod+p.soyad+p.ad+p.ataAdi+(p.finKod||'')+(p.elaqeNomre1||'')).toLowerCase().includes(q));
    pageNum[key]=1;
    const {pageRows, totalPages, total}=paginateArr(rows, key);
    document.getElementById('tbody-'+key).innerHTML=renderSimpleRows(key, pageRows);
    document.getElementById('pagination-'+key).innerHTML=paginationHtml(key, totalPages, total);
  } else if(key==='customers'){
    const rows=state.customers.filter(c=>!q || (fullName(c)+' '+(c.kod||'')+' '+(c.finKod||'')+' '+(c.elaqeNomre1||'')).toLowerCase().includes(q));
    pageNum.customers=1;
    const {pageRows, totalPages, total}=paginateArr(rows, 'customers');
    document.getElementById('tbody-customers').innerHTML=renderCustomerRows(pageRows);
    document.getElementById('pagination-customers').innerHTML=paginationHtml('customers', totalPages, total);
  } else if(key==='contracts'){
    const rows=state.contracts.filter(c=>!q || (c.nomre+' '+customerName(c.customerId)).toLowerCase().includes(q));
    pageNum.contracts=1;
    const {pageRows, totalPages, total}=paginateArr(rows, 'contracts');
    document.getElementById('tbody-contracts').innerHTML=renderContractRows(pageRows);
    document.getElementById('pagination-contracts').innerHTML=paginationHtml('contracts', totalPages, total);
  }
});

/* ============ API LAYER (PHP backend: api.php) ============ */
const API_BASE='api.php?col=';
async function readErr(r, fallback){
  try{ const j=await r.json(); if(j&&j.error) return j.error; }catch(e){}
  return fallback;
}
async function apiList(col){
  const r=await fetch(API_BASE+col);
  if(!r.ok) throw new Error(await readErr(r,'Yükləmə xətası ('+col+')'));
  return r.json();
}
async function apiPaymentSums(){
  const r=await fetch(API_BASE+'payments&agg=sum');
  if(!r.ok) throw new Error(await readErr(r,'Yükləmə xətası (ödəniş cəmləri)'));
  return r.json();
}
async function apiPaymentsForContract(contractId){
  const r=await fetch(API_BASE+'payments&contractId='+encodeURIComponent(contractId));
  if(!r.ok) throw new Error(await readErr(r,'Yükləmə xətası (ödənişlər)'));
  return r.json();
}
async function apiAdd(col,data){
  const r=await fetch(API_BASE+col,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  if(!r.ok) throw new Error(await readErr(r,'Əlavə etmə xətası ('+col+')'));
  return r.json();
}
async function apiUpdate(col,id,data){
  const r=await fetch(API_BASE+col+'&id='+encodeURIComponent(id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  if(!r.ok) throw new Error(await readErr(r,'Yeniləmə xətası ('+col+')'));
  return r.json();
}
async function apiDelete(col,id){
  const r=await fetch(API_BASE+col+'&id='+encodeURIComponent(id),{method:'DELETE'});
  if(!r.ok) throw new Error(await readErr(r,'Silmə xətası ('+col+')'));
  return r.json();
}
