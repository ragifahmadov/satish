  .ua-col-h{margin-bottom:6px;font-size:13px;}
  .ua-search{width:100%;margin-bottom:6px;}

  .ua-bar{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);}
  .ua-ok{color:var(--green);font-weight:600;font-size:13px;margin-right:auto;}

  .section-title{font-size:14px;font-weight:600;margin:26px 0 12px;}
  /* modal */
  #modal-root{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:40px 16px;}

  .assign-row{display:flex;gap:8px;align-items:end;margin-bottom:8px;}

  .banner{background:var(--red-bg);color:var(--red);padding:11px 16px;border-radius:8px;font-size:13px;margin-bottom:18px;}
  .notice{background:rgba(184,134,63,.13);color:var(--accent-text);padding:9px 14px;border-radius:8px;font-size:13px;margin:0 0 10px;}
  .placeholder-box{padding:70px 30px;text-align:center;color:var(--text-muted);border:1px dashed var(--border);border-radius:10px;}
  @media (max-width:820px){
    #layout{flex-direction:column;}
    #sidebar{width:100%;height:auto;position:relative;flex-direction:row;overflow-x:auto;padding:12px;}
    .brand{padding:4px 10px;}
    nav{flex-direction:row;}
    .navbtn{white-space:nowrap;}
    .sidebar-foot{display:none;}
    #content{padding:20px;}
    .grid2,.grid3{grid-template-columns:1fr;}

</style>

function upsertInState(col, item){
  if(!state[col] || !item || !item.id) return;
  const idx=state[col].findIndex(x=>x.id===item.id);
  if(idx>=0) state[col][idx]=item; else state[col].push(item);
}
function removeFromState(col, id){
  if(!state[col]) return;
  state[col]=state[col].filter(x=>x.id!==id);
}

function isAdmin(){ return me.role==='admin'; }
function permKey(id){ return SCREEN_PERM[id]||id; }
function can(id, level){ if(isAdmin()) return true; return (me.screens[permKey(id)]||0)>=level; }   // 1 baxış, 2 dəyişiklik, 3 silmə

function screenAllowed(id){
  if(ADMIN_ONLY_SCREENS.includes(id)) return isAdmin();
  if(id==='reports') return REPORT_SCREENS.some(r=>can(r,1));

}

/* ============ HELPERS ============ */
function fmtMoney(n){ n=Number(n)||0; return n.toLocaleString('az-AZ',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₼'; }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear(); }
function esc(s){ return (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fullName(o){ if(!o) return ''; return [o.soyad,o.ad,o.ataAdi].filter(Boolean).join(' '); }
function byId(arr,id){ return arr.find(x=>x.id===id); }
function phonesToArr(str){ return (str||'').split(',').map(s=>s.trim()).filter(Boolean); }

function customerName(id){ const c=byId(state.customers,id); return c?fullName(c):'—'; }
function salespersonName(id){ const s=byId(state.salespeople,id); return s?fullName(s):'—'; }
function collectorName(id){ const c=byId(state.collectors,id); return c?fullName(c):'—'; }
function curatorName(id){ const c=byId(state.curators,id); return c?fullName(c):'—'; }
function currentYm(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

function scheduleMonths(contract){
  const out=[]; if(!contract.tarix||!contract.muddet) return out;
  const start=new Date(contract.tarix+'T00:00:00');
  for(let i=1;i<=Number(contract.muddet);i++){
    const d=new Date(start.getFullYear(), start.getMonth()+i, 1);
    out.push({index:i,label:'Ay '+i+' — '+AZ_MONTHS[d.getMonth()]+' '+d.getFullYear(),date:d});
  }
  return out;
}
// "Geri qaytarma" (mal qaytarılması) əməliyyatı cədvəldə mənfi məbləğlə görünür, amma
// ödəniş sayılmır — müqavilənin xalis satış məbləğini azaldır.
function isReturnPayment(p){ return !!p && p.emeliyyatNovu==='Geri qaytarma'; }
function contractPaidSum(contractId){ return Number(paymentSums[contractId])||0; }
function contractReturnedSum(contractId){ return Number(returnSums[contractId])||0; }
function contractNetSale(contract){ return (Number(contract.meblag)||0) - contractReturnedSum(contract.id); }
function contractMonthly(contract){
  const m=Number(contract.muddet)||0; if(!m) return 0;
  return Math.max(0,(contractNetSale(contract)-(Number(contract.ilkinOdenis)||0))/m);
}
function contractDebt(contract){
  return contractNetSale(contract) - (Number(contract.ilkinOdenis)||0) - contractPaidSum(contract.id);
}
function contractScheduleDebt(contract){
  return Math.max(0, contractMonthly(contract)*scheduleDueCount(contract) - contractPaidSum(contract.id));
}
function currentCollectorForContract(contract,onDate){
  const d=onDate?new Date(onDate):new Date();
  const list=contract.tehsilatciTeyinatlari||[];
  const hit=list.find(a=>{
    const s=a.baslama?new Date(a.baslama):null;
    const e=a.son?new Date(a.son):null;
    return (!s||d>=s)&&(!e||d<=e);
  });
  return hit?hit.collectorId:(list.length?list[list.length-1].collectorId:null);
}
// Müqavilələr siyahısında göstərilən təhsilatçı: "Son" xanası boş olan təyinat (davam edən təyinat)
function activeCollectorForContract(contract){
  const list=contract.tehsilatciTeyinatlari||[];
  const hit=list.find(a=>!a.son);
  return hit?hit.collectorId:(list.length?list[list.length-1].collectorId:null);
}

const PSEUDO_LOADERS={
  paymentSums: async ()=>{
    const r=await apiPaymentSums();
    paymentSums={}; returnSums={};
    for(const cid in r){
      paymentSums[cid]=Number(r[cid][0])||0;
      const rt=Number(r[cid][1])||0;
      if(rt) returnSums[cid]=rt;
    }
  },

  dashMonth: async ()=>{ dashMonthTotal=await apiMonthSum(currentYm()); },
};
async function ensureLoaded(cols){
  const need=cols.filter(c=>!loadedCols.has(c));
  if(!need.length) return;
  await Promise.all(need.map(async c=>{
    if(PSEUDO_LOADERS[c]) await PSEUDO_LOADERS[c]();
    else state[c]=await apiList(c);
    loadedCols.add(c);
  }));
}
// Ödənişlər ekranı: tam cədvəl əvəzinə yalnız seçilmiş müqavilənin ödənişləri yüklənir
const loadedContractPayments=new Set();
async function ensureContractPayments(contractId){
  if(loadedCols.has('payments') || loadedContractPayments.has(contractId)) return;
  const fresh=await apiPaymentsForContract(contractId);
  state.payments=state.payments.filter(p=>p.contractId!==contractId).concat(fresh);
  loadedContractPayments.add(contractId);
}

function setFieldError(form, name, msg){
  const input=form.querySelector(`[name="${name}"]`);
  if(input) input.classList.add('input-error');
  const errEl=form.querySelector(`.field-err[data-err-for="${name}"]`);
  if(errEl){ errEl.textContent=msg; errEl.style.display='block'; }
}
function isDuplicate(list, field, value, excludeId){
  if(!value) return false;
  const v=value.trim().toLowerCase();
  return list.some(item=>item.id!==excludeId && (item[field]||'').toString().trim().toLowerCase()===v);
}
function calcAge(dateStr){
  const b=new Date(dateStr+'T00:00:00');
  if(isNaN(b)) return null;
  const now=new Date();
  let age=now.getFullYear()-b.getFullYear();
  const mDiff=now.getMonth()-b.getMonth();
  if(mDiff<0 || (mDiff===0 && now.getDate()<b.getDate())) age--;
  return age;
}
function bindDigitsOnly(form){
  ['elaqeNomre1','elaqeNomre2'].forEach(n=>{
    const el=form.querySelector(`[name="${n}"]`);
    if(el) el.addEventListener('input', ()=>{ el.value=el.value.replace(/\D/g,'').slice(0,9); });
  });
}

function paginateArr(array, key, size){
  size=size||PAGE_SIZE;
  const total=array.length;
  const totalPages=Math.max(1, Math.ceil(total/size));
  if(pageNum[key]>totalPages) pageNum[key]=totalPages;
  if(pageNum[key]<1) pageNum[key]=1;
  const start=(pageNum[key]-1)*size;
  return {pageRows:array.slice(start,start+size), totalPages, total};
}
function paginationHtml(key, totalPages, total){
  if(total===0) return '';
  return `<div class="pagination" style="display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px;">
    <span class="muted" style="font-size:12.5px;">${total} nəticə</span>
    <button class="btn btn-ghost btn-sm" data-action="page-prev" data-key="${key}" ${pageNum[key]<=1?'disabled':''}>‹ Əvvəlki</button>
    <span class="muted" style="font-size:12.5px;">Səhifə ${pageNum[key]} / ${totalPages}</span>
    <button class="btn btn-ghost btn-sm" data-action="page-next" data-key="${key}" ${pageNum[key]>=totalPages?'disabled':''}>Növbəti ›</button>
  </div>`;
}

function bindCustomerSearch(form){
  const input=form.querySelector('#customer-search');
  const hidden=form.querySelector('#customer-search-hidden');
  const results=form.querySelector('#customer-search-results');
  function renderList(q){
    const query=(q||'').toLowerCase();
    if(query.length<3){ results.innerHTML=`<div class="search-item muted">Ən azı 3 simvol yazın…</div>`; results.style.display='block'; return; }
    const matches=state.customers.filter(c=>(fullName(c)+' '+(c.kod||'')+' '+(c.finKod||'')).toLowerCase().includes(query)).slice(0,30);
    results.innerHTML = matches.length
      ? matches.map(c=>`<div class="search-item" data-id="${c.id}">${esc(fullName(c))}${c.kod?' <span class="muted">— '+esc(c.kod)+'</span>':''}</div>`).join('')
      : `<div class="search-item muted">Nəticə tapılmadı</div>`;
    results.style.display='block';
  }
  input.addEventListener('focus', ()=>renderList(input.value));
  input.addEventListener('input', ()=>{ hidden.value=''; renderList(input.value); });
  input.addEventListener('blur', ()=>{ setTimeout(()=>{ results.style.display='none'; }, 150); });
  results.addEventListener('mousedown', (e)=>{
    const item=e.target.closest('.search-item[data-id]');
    if(!item) return;
    const c=byId(state.customers, item.dataset.id);
    if(c){ input.value=fullName(c)+(c.kod?' — '+c.kod:''); hidden.value=c.id; }
    results.style.display='none';
  });
}
function openAssignmentsInfo(contractId, role){
  role=role||'collector';
  const R=ROLES[role];
  const c=byId(state.contracts,contractId);
  if(!c) return;
  const list=c[R.field]||[];
  const sorted=[...list].sort((a,b)=>{
    const aActive=!a.son, bActive=!b.son;
    if(aActive && !bActive) return -1;
    if(!aActive && bActive) return 1;
    return (b.baslama||'').localeCompare(a.baslama||'');
  });
  const rowsHtml=sorted.length ? sorted.map(a=>{
    const active=!a.son;
    return `<div style="padding:10px 12px;border-radius:8px;margin-bottom:8px;${active?'background:rgba(184,134,63,.12);border:1px solid var(--accent);':'background:var(--bg-page);border:1px solid var(--border);'}">

/* ============ PAYMENTS ============ */
let paymentsContractId=null;

function scheduleDueCount(contract){
  const months=scheduleMonths(contract);
  const today=new Date(); today.setHours(0,0,0,0);
  let due=0;
  for(const m of months){ if(m.date<=today) due=m.index; else break; }
  return due;
}
function currentScheduleIndex(contract){
  const due=scheduleDueCount(contract);
  const muddet=Number(contract.muddet)||1;
  return Math.min(Math.max(due,1), muddet);
}
function todayIso(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

  return months.map(m=>{

// Müqavilənin yerli cəmlərini (ödəniş, geri qaytarma, son ödəniş) yüklənmiş ödənişlərdən yenidən hesablayır
function recalcContractPaymentAggregates(cid){
  const list=state.payments.filter(p=>p.contractId===cid);
  let paid=0, ret=0, last='';
  for(const p of list){
    const a=Number(p.meblag)||0;
    if(isReturnPayment(p)) ret+=Math.abs(a);
    else { paid+=a; if(a>0 && (p.odemeTarixi||'')>last) last=p.odemeTarixi; }
  }
  paymentSums[cid]=paid;
  if(ret) returnSums[cid]=ret; else delete returnSums[cid];
  if(last) paymentLast[cid]=last; else delete paymentLast[cid];
}
function monthPart(p){ return (!p || isReturnPayment(p) || (p.odemeTarixi||'').slice(0,7)!==currentYm())?0:(Number(p.meblag)||0); }

async function submitPaymentEdit(form){
  const p=byId(state.payments,form.dataset.id);
  const errEl=document.getElementById('pe-err');
  errEl.style.display='none';
  if(!p) return;
  const amount=Number(document.getElementById('pe-amount').value);
  const date=document.getElementById('pe-date').value;
  if(!amount || amount<=0){ errEl.textContent='Məbləği düzgün daxil edin.'; errEl.style.display='block'; return; }
  if(!date){ errEl.textContent='Tarixi seçin.'; errEl.style.display='block'; return; }
  const ret=isReturnPayment(p);
  try{
    const before=monthPart(p);
    const saved=await apiUpdate('payments', p.id, {meblag:ret?-amount:amount, odemeTarixi:date});
    upsertInState('payments', saved);
    recalcContractPaymentAggregates(saved.contractId);
    dashMonthTotal+=monthPart(saved)-before;
    closeModal();
    renderScreen();
  }catch(err){
    errEl.textContent='Yadda saxlanmadı: '+err.message; errEl.style.display='block';
  }
}
async function deletePayment(id){
  const p=byId(state.payments,id);
  if(!p) return;
  const ret=isReturnPayment(p);
  if(!confirm((ret?'Geri qaytarma':'Ödəniş')+' silinsin? '+fmtMoney(Math.abs(Number(p.meblag)||0))+', '+fmtDate(p.odemeTarixi))) return;
  try{
    await apiDelete('payments', id);
  }catch(err){ alert('Silinmədi: '+err.message); return; }
  dashMonthTotal-=monthPart(p);
  removeFromState('payments', id);
  recalcContractPaymentAggregates(p.contractId);
  renderScreen();
}

// Serverdəki PAYMENT_NO_COLLECTOR_MSG ilə eyni mətn (permissions.php)
const PAYMENT_NO_COLLECTOR_MSG='Bu müqaviləyə təhsilatçı təyin olunmayıb. Ödəniş qəbul etmək üçün əvvəlcə «Təhsilatçı dəyişikliyi» ekranında müqaviləyə təhsilatçı təyin edin.';
async function recordQuickPayment(contractId){
  const errEl=document.getElementById('qp-err');
  errEl.style.display='none';
  const contract=byId(state.contracts,contractId);
  if(!contract) return;
  const amount=Number(document.getElementById('qp-amount').value);
  const date=document.getElementById('qp-date').value;
  const rc=document.getElementById('qp-return');
  const isReturn=!!(rc && rc.checked);
  if(!amount || amount<=0){ errEl.textContent='Məbləği düzgün daxil edin.'; errEl.style.display='block'; return; }
  if(!date){ errEl.textContent='Tarixi seçin.'; errEl.style.display='block'; return; }
  const payCollectorId=activeCollectorForContract(contract)||'';
  // Təhsilatçı dəyişikliyi hüququ olan istifadəçi başqa təhsilatçı seçə bilər → müqavilənin təhsilatçısı da dəyişir
  const selEl=can('reassign-collector',2)?document.getElementById('qp-collector-sel'):null;   // siyahı yalnız bu hüquqla göstərilir
  const chosen=selEl?selEl.value:payCollectorId;
  if(!chosen){ errEl.textContent=selEl?'Təhsilatçı seçin.':PAYMENT_NO_COLLECTOR_MSG; errEl.style.display='block'; return; }
  const reassign=chosen!==payCollectorId;
  if(reassign && !confirm('Müqavilənin təhsilatçısı dəyişdiriləcək: '+(payCollectorId?collectorName(payCollectorId):'(təyin olunmayıb)')+' → '+collectorName(chosen)
      +'.\n'+(payCollectorId?'Cari təhsilatçının təyinatı bu günlə bağlanacaq, ':'')+'seçilən təhsilatçı bu gündən müqaviləyə təyin olunacaq və ödəniş ona yazılacaq. Davam edilsin?')){
    errEl.textContent='Əməliyyat yadda saxlanmadı (təsdiqləmədiniz).'; errEl.style.display='block'; return;
  }
  if(isReturn){
    const netSale=contractNetSale(contract);
    if(amount>netSale+0.01 && !confirm('Geri qaytarılan məbləğ ('+fmtMoney(amount)+') müqavilənin qalan satış məbləğindən ('+fmtMoney(netSale)+') çoxdur. Davam edilsin?')){
      errEl.textContent='Əməliyyat yadda saxlanmadı (təsdiqləmədiniz).'; errEl.style.display='block'; return;
    }
  }
  const curIdx=currentScheduleIndex(contract);
  const months=scheduleMonths(contract);
  const curMonth=months.find(m=>m.index===curIdx);
  try{
    const saved=await apiAdd('payments', {
      contractId:contract.id, meblag:isReturn?-amount:amount, odemeTarixi:date, collectorId:chosen,   // server özü yenidən təyin edir
      ...(reassign?{reassignCollectorId:chosen}:{}),
      qeyd:'', qrafikAyIndex:curIdx, qrafikAyLabel:curMonth?curMonth.label:'',
      emeliyyatNovu:isReturn?'Geri qaytarma':'Ödəniş',
    });
    if(saved._contract){ upsertInState('contracts', saved._contract); delete saved._contract; }   // təhsilatçı dəyişdisə
    upsertInState('payments', saved);
    const cid=saved.contractId, amt=Number(saved.meblag)||0;
    if(isReturnPayment(saved)){
      returnSums[cid]=(Number(returnSums[cid])||0)+Math.abs(amt);
    } else {
      paymentSums[cid]=(Number(paymentSums[cid])||0)+amt;
      if(amt>0 && (!paymentLast[cid] || date>paymentLast[cid])) paymentLast[cid]=date;
      if(date.slice(0,7)===currentYm()) dashMonthTotal+=amt;
    }
    renderScreen();
  }catch(err){
    errEl.textContent='Yadda saxlanmadı: '+err.message;
    errEl.style.display='block';
  }
}

  if(!reassignIds[role].includes(contractId)) reassignIds[role].push(contractId);

function removeReassignContract(role, contractId){

async function applyReassign(role){
  role=role||'collector';
  const R=ROLES[role];
  const errEl=document.getElementById('reassign-err');
  errEl.style.display='none';
  const newId=document.getElementById('reassign-assignee').value;
  if(!newId){ errEl.textContent='Yeni '+R.lower+' seçin.'; errEl.style.display='block'; return; }
  if(!reassignIds[role].length){ errEl.textContent='Siyahıya ən azı bir müqavilə əlavə edin.'; errEl.style.display='block'; return; }
  const today=todayIso();
  let sameCount=0;
  const op={opId:uuidv4(), opLabel:R.label+' dəyişikliyi → '+roleName(role,newId)};
  try{
    for(const id of reassignIds[role]){
      const c=byId(state.contracts,id);
      if(!c) continue;
      if(activeAssigneeId(c,role)===newId) sameCount++;
      const list=(c[R.field]||[]).map(a=>a.son?a:{...a,son:today});
      list.push({[R.idKey]:newId, baslama:today, son:''});
      const saved=await apiUpdate('contracts', c.id, {[R.field]:list}, op);
      upsertInState('contracts', saved);
    }
    reassignIds[role]=[];
    renderScreen();
    if(sameCount>0) alert(sameCount+' müqavilədə '+R.lower+' artıq eyni idi, amma yenə də yeni təyinat yaradıldı.');
  }catch(err){
    errEl.textContent='Xəta: '+err.message;
    errEl.style.display='block';
  }
}

/* ============ TƏHSİLATÇI HESABATLARI (gündəlik, əl ilə) ============
   Bir təhsilatçı + bir gün = bir qeyd; Göndərilən = Təhsilat − Benzin − Digər (mənfi olmaz) — server də yoxlayır və hesablayır.

const CR_PAGE_SIZE=50;
let crTab='list';
let crFilters={};
let crApplied=null;
function resetCrFilters(){

function crRows(){

  {th:'<th class="num">Təhsilat<br>məbləği</th>', xl:'Təhsilat məbləği', type:'money', width:16, td:r=>`<td class="num">${fmtMoney(r.tehsilatMeblegi)}</td>`, val:r=>Number(r.tehsilatMeblegi)||0},
  {th:'<th class="num">Benzin<br>xərci</th>', xl:'Benzin xərci', type:'money', width:14, td:r=>`<td class="num">${fmtMoney(r.benzinXerci)}</td>`, val:r=>Number(r.benzinXerci)||0},
  {th:'<th class="num">Digər<br>xərc</th>', xl:'Digər xərc', type:'money', width:14, td:r=>`<td class="num">${fmtMoney(r.digerXerc)}</td>`, val:r=>Number(r.digerXerc)||0},
  {th:'<th class="num">Sənəd<br>sayı</th>', xl:'Sənəd sayı', type:'int', width:11, td:r=>`<td class="num">${Number(r.senedSayi)||0}</td>`, val:r=>Number(r.senedSayi)||0},
  {th:'<th class="num">Göndərilən<br>məbləğ</th>', xl:'Göndərilən məbləğ', type:'money', width:17, td:r=>`<td class="num"><strong>${fmtMoney(r.gonderilenMebleg)}</strong></td>`, val:r=>Number(r.gonderilenMebleg)||0},

];
function crActionsCell(r){

function crListFiltered(q){

    </table></div>
    <div id="pagination-collector-reports">${paginationHtml('collector-reports', totalPages, total)}</div></div>`);

function crFilterRows(f){
  const num=v=>(v===''||v==null||isNaN(Number(v)))?null:Number(v);
  const eps=0.0001, q=(f.qeyd||'').toLowerCase();
  const rng=(val,mn,mx)=>{ const a=num(mn), b=num(mx); return (a==null||val>=a-eps) && (b==null||val<=b+eps); };
  return crRows().filter(r=>{
    if(f.tarixDan && (r.tarix||'')<f.tarixDan) return false;
    if(f.tarixDek && (r.tarix||'')>f.tarixDek) return false;
    if(f.collector && r.collectorId!==f.collector) return false;
    if(!rng(Number(r.tehsilatMeblegi)||0,f.tehsilatMin,f.tehsilatMax)) return false;
    if(!rng(Number(r.benzinXerci)||0,f.benzinMin,f.benzinMax)) return false;
    if(!rng(Number(r.digerXerc)||0,f.digerMin,f.digerMax)) return false;
    if(!rng(Number(r.senedSayi)||0,f.senedMin,f.senedMax)) return false;
    if(!rng(Number(r.gonderilenMebleg)||0,f.gonderilenMin,f.gonderilenMax)) return false;
    if(q && !(r.qeyd||'').toLowerCase().includes(q)) return false;
    return true;
  });
}
function crResultRows(){ return crApplied?crFilterRows(crApplied):[]; }
function crTotals(rows){ return rows.reduce((t,r)=>({n:t.n+1,t:t.t+(Number(r.tehsilatMeblegi)||0),b:t.b+(Number(r.benzinXerci)||0),d:t.d+(Number(r.digerXerc)||0),s:t.s+(Number(r.senedSayi)||0),g:t.g+(Number(r.gonderilenMebleg)||0)}),{n:0,t:0,b:0,d:0,s:0,g:0}); }
function crFilterDescription(f){
  f=f||crApplied||crFilters;
  const out=[], add=(l,v)=>{ if(v!=='' && v!=null) out.push({l,v:String(v)}); };
  if(f.tarixDan) add('Tarix (dan)',fmtDate(f.tarixDan));
  if(f.tarixDek) add('Tarix (dək)',fmtDate(f.tarixDek));
  if(f.collector) add('Təhsilatçı',collectorName(f.collector));
  add('Təhsilat məbləği (min)',f.tehsilatMin); add('Təhsilat məbləği (maks)',f.tehsilatMax);
  add('Benzin xərci (min)',f.benzinMin); add('Benzin xərci (maks)',f.benzinMax);
  add('Digər xərc (min)',f.digerMin); add('Digər xərc (maks)',f.digerMax);
  add('Sənəd sayı (min)',f.senedMin); add('Sənəd sayı (maks)',f.senedMax);
  add('Göndərilən (min)',f.gonderilenMin); add('Göndərilən (maks)',f.gonderilenMax);
  add('Qeyd',f.qeyd);
  return out;
}

      </div></div>

/* ---- Hesabat 1: Gecikmiş müqavilələr ----
   Gecikmə = ən son (real) ödəniş tarixi ilə bu gün arasında tam ay fərqi.
   Heç ödənişi olmayan müqavilədə müqavilə tarixi əsas götürülür.
   Yalnız hələ borcu qalan müqavilələr gecikmiş sayılır. */
const OVERDUE_MIN_MONTHS=2;
const OVERDUE_PAGE_SIZE=50;
let overdueBase=[];
let overdueFilters={};
let overdueApplied=null;    // «Axtar» basılanda filtrlərin surəti; null = hələ axtarış olmayıb
let overdueErr='';
const OVERDUE_DATA=['contracts','customers','salespeople','collectors','curators','paymentSums','paymentLast'];
function resetOverdueFilters(){
  overdueFilters={nomre:'',musteri:'',tel:'',satici:'',tehsilatci:'',kurator:'',tarixDan:'',tarixDek:'',
    satisMin:'',satisMax:'',borcMin:'',borcMax:'',qrafikMin:'',gecMin:'',gecMax:''};
}
resetOverdueFilters();

function monthsSince(iso, today){
  const f=new Date(iso+'T00:00:00');
  if(isNaN(f)) return 0;
  let m=(today.getFullYear()-f.getFullYear())*12 + (today.getMonth()-f.getMonth());
  if(today.getDate()<f.getDate()) m--;
  return Math.max(0,m);
}

function buildOverdueBase(){
  const today=new Date(); today.setHours(0,0,0,0);
  const mk=arr=>{ const m=new Map(); arr.forEach(x=>m.set(x.id,x)); return m; };
  const cust=mk(state.customers), sp=mk(state.salespeople), col=mk(state.collectors), cur=mk(state.curators);
  const nm=(m,id)=>{ const o=m.get(id); return o?fullName(o):'—'; };
  const rows=[];
  for(const c of state.contracts){
    const debt=contractDebt(c);
    if(debt<=0.009) continue;
    const lastIso=paymentLast[c.id]||c.tarix;
    if(!lastIso) continue;
    const months=monthsSince(lastIso,today);
    if(months<OVERDUE_MIN_MONTHS) continue;
    const cu=cust.get(c.customerId);
    const collectorId=activeCollectorForContract(c)||'';
    const curatorId=activeCuratorForContract(c)||'';
    const phones=cu?[cu.elaqeNomre1,cu.elaqeNomre2].filter(Boolean):[];
    rows.push({
      c, customer:cu?fullName(cu):'—', phone:phones.join(', '), phoneDigits:phones.join('').replace(/\D/g,''),
      salesperson:nm(sp,c.salespersonId),
      collectorId, collector:collectorId?nm(col,collectorId):'—',
      curatorId, curator:curatorId?nm(cur,curatorId):'—',
      sale:Number(c.meblag)||0, debt, scheduleDebt:contractScheduleDebt(c),
      lastIso:paymentLast[c.id]||'', months,
    });
  }
  rows.sort((a,b)=>b.months-a.months || b.debt-a.debt);
  return rows;
}

function filterOverdue(rows, f){
  const lc=v=>(v||'').toString().toLowerCase();
  const num=v=>(v===''||v==null||isNaN(Number(v)))?null:Number(v);
  const tel=(f.tel||'').replace(/\D/g,'');
  const nomre=lc(f.nomre), musteri=lc(f.musteri);
  const sMin=num(f.satisMin), sMax=num(f.satisMax), bMin=num(f.borcMin), bMax=num(f.borcMax);
  const qMin=num(f.qrafikMin), gMin=num(f.gecMin), gMax=num(f.gecMax);
  const eps=0.0001;
  const assigneeOk=(sel,id)=> !sel || (sel==='__none__' ? !id : id===sel);
  return rows.filter(r=>{
    if(nomre && !lc(r.c.nomre).includes(nomre)) return false;
    if(musteri && !lc(r.customer).includes(musteri)) return false;
    if(tel && !r.phoneDigits.includes(tel)) return false;
    if(f.satici && r.c.salespersonId!==f.satici) return false;
    if(!assigneeOk(f.tehsilatci,r.collectorId)) return false;
    if(!assigneeOk(f.kurator,r.curatorId)) return false;
    if(f.tarixDan && (r.c.tarix||'')<f.tarixDan) return false;
    if(f.tarixDek && (r.c.tarix||'')>f.tarixDek) return false;
    if(sMin!=null && r.sale<sMin-eps) return false;
    if(sMax!=null && r.sale>sMax+eps) return false;
    if(bMin!=null && r.debt<bMin-eps) return false;
    if(bMax!=null && r.debt>bMax+eps) return false;
    if(qMin!=null && r.scheduleDebt<qMin-eps) return false;
    if(gMin!=null && r.months<gMin) return false;
    if(gMax!=null && r.months>gMax) return false;
    return true;
  });
}

// Sütunların tək elanı: th/td ekran üçün, xl/type/width/val Excel üçün (hər ikisi eyni mənbədən qurulur)

// Tətbiq olunan filtrlərin oxunaqlı siyahısı (Excel "Məlumat" vərəqi və export logu üçün)
function overdueFilterDescription(f){
  f=f||overdueApplied||overdueFilters;
  const out=[];
  const add=(l,v)=>{ if(v!=='' && v!=null) out.push({l,v:String(v)}); };
  const person=(arr,id)=>{ const o=byId(arr,id); return o?fullName(o):id; };
  add('Müqavilə №',f.nomre); add('Müştəri',f.musteri); add('Əlaqə nömrəsi',f.tel);
  if(f.satici) add('Satıcı',person(state.salespeople,f.satici));
  if(f.tehsilatci) add('Təhsilatçı',f.tehsilatci==='__none__'?'Təyin olunmayıb':person(state.collectors,f.tehsilatci));
  if(f.kurator) add('Kurator',f.kurator==='__none__'?'Təyin olunmayıb':person(state.curators,f.kurator));
  if(f.tarixDan) add('Müqavilə tarixi (dan)',fmtDate(f.tarixDan));
  if(f.tarixDek) add('Müqavilə tarixi (dək)',fmtDate(f.tarixDek));
  add('Satış məbləği (min)',f.satisMin); add('Satış məbləği (maks)',f.satisMax);
  add('Cari borc (min)',f.borcMin); add('Cari borc (maks)',f.borcMax);
  add('Qrafik borcu (min)',f.qrafikMin); add('Gecikmə ay (min)',f.gecMin); add('Gecikmə ay (maks)',f.gecMax);
  return out;
}

function overdueResultRows(){ return overdueApplied?filterOverdue(overdueBase, overdueApplied):[]; }
function refreshOverdueTable(){
  const tbody=document.getElementById('overdue-tbody');
  if(!tbody) return;
  const eb0=document.getElementById('export-btn');
  if(!overdueApplied || overdueErr){
    document.getElementById('overdue-summary').innerHTML='';

    document.getElementById('pagination-report-overdue').innerHTML='';
    if(eb0){ eb0.textContent='Excelə yüklə'; eb0.disabled=true; }
    return;
  }
  const rows=overdueResultRows();
  const {pageRows, totalPages, total}=paginateArr(rows,'report-overdue',OVERDUE_PAGE_SIZE);
  const sumDebt=rows.reduce((a,r)=>a+r.debt,0), sumSch=rows.reduce((a,r)=>a+r.scheduleDebt,0);

  const eb=document.getElementById('export-btn');
  if(eb){ eb.textContent=total?('Excelə yüklə — '+total+' sətir'):'Excelə yüklə'; eb.disabled=!total; }
}

/* ---- Hesabat 2: Təhsilat hesabatı ----
   Sətirlər serverdən gəlir (report-api.php?report=collections): yalnız seçilmiş dövrün ödəniş və geri qaytarmaları,
   əhatə serverdə tətbiq olunur. İlkin ödəniş daxil deyil (o, ödəniş sətri deyil, müqavilənin üstündədir).
   Təhsilatçı = ödənişin ÖZÜNƏ yazılmış təhsilatçı (ödəniş qəbul edilərkən müqavilənin hazırkı təhsilatçısı);
   boşdursa "Təyin olunmayıb". Geri qaytarma toplanmış məbləğə qatılmır, ayrıca sütunda göstərilir. */
const COLL_PAGE_SIZE=50;
const COLL_NONE='__none__';
let collFilters={};
let coll={tab:'summary', rows:[], applied:null, loadedKey:'', loading:false, err:'', req:0};   // applied: «Axtar»-dakı filtrlər
function resetCollFilters(){
  const today=bakuDateIso();
  collFilters={from:today.slice(0,8)+'01', to:today, collector:''};
}
resetCollFilters();
function collKey(f){ f=f||coll.applied; return f?(f.from+'|'+f.to+'|'+f.collector):''; }
function collCollectorName(id){
  if(!id) return 'Təyin olunmayıb';
  const o=byId(state.collectors,id);
  return o?fullName(o):'(silinmiş təhsilatçı)';
}
function collFilterError(f){
  f=f||collFilters;
  if(!f.from || !f.to) return 'Hər iki tarixi seçin.';
  if(f.from>f.to) return 'Başlanğıc tarixi son tarixdən böyük ola bilməz.';
  return '';
}
async function loadCollections(){
  const f=coll.applied;
  if(!f) return;
  const key=collKey(f);
  const my=++coll.req;
  coll.loading=true; coll.err='';
  try{
    const r=await fetch('report-api.php?report=collections&from='+encodeURIComponent(f.from)+'&to='+encodeURIComponent(f.to)+'&collector='+encodeURIComponent(f.collector));
    if(!r.ok) throw new Error(await readErr(r,'Server cavabı: '+r.status));
    const j=await r.json();
    if(my!==coll.req) return;                       // arada filtr dəyişib — köhnə cavab atılır
    coll.rows=(j.rows||[]).map(x=>Object.assign({}, x, {colName:collCollectorName(x.col)}));
    coll.loadedKey=key;
  }catch(err){
    if(my!==coll.req) return;
    coll.rows=[]; coll.loadedKey=''; coll.err='Məlumat yüklənmədi: '+err.message;
  }finally{
    if(my===coll.req) coll.loading=false;
  }
}
// Ümumiləşdirilmiş: təhsilatçı üzrə cəmlər ("Təyin olunmayıb" sonda)
function collSummaryRows(rows){
  const m=new Map();
  for(const r of rows){
    let g=m.get(r.col);
    if(!g){ g={col:r.col, name:r.colName, cnt:0, paid:0, ret:0}; m.set(r.col,g); }
    if(r.ret) g.ret+=r.amt; else { g.cnt++; g.paid+=r.amt; }
  }
  const out=[...m.values()].map(g=>Object.assign(g,{net:g.paid-g.ret}));
  out.sort((a,b)=>(a.col?0:1)-(b.col?0:1) || a.name.localeCompare(b.name,'az'));
  return out;
}
function collTotals(sumRows){
  return sumRows.reduce((t,g)=>({cnt:t.cnt+g.cnt, paid:t.paid+g.paid, ret:t.ret+g.ret, net:t.net+g.net}),{cnt:0,paid:0,ret:0,net:0});
}
// Sütunların tək elanı (ekran + Excel)
const COLL_SUMMARY_COLUMNS=[
  {th:'<th>Təhsilatçı</th>', xl:'Təhsilatçı', type:'text', width:36, td:r=>`<td>${esc(r.name)}</td>`, val:r=>r.name},
  {th:'<th class="num">Ödəniş sayı</th>', xl:'Ödəniş sayı', type:'int', width:14, td:r=>`<td class="num">${r.cnt}</td>`, val:r=>r.cnt},
  {th:'<th class="num">Toplanmış məbləğ</th>', xl:'Toplanmış məbləğ', type:'money', width:18, td:r=>`<td class="num">${fmtMoney(r.paid)}</td>`, val:r=>r.paid},
  {th:'<th class="num">Geri qaytarma</th>', xl:'Geri qaytarma', type:'money', width:16, td:r=>`<td class="num"${r.ret?' style="color:var(--red);"':''}>${fmtMoney(r.ret)}</td>`, val:r=>r.ret},
  {th:'<th class="num">Xalis</th>', xl:'Xalis', type:'money', width:16, td:r=>`<td class="num">${fmtMoney(r.net)}</td>`, val:r=>r.net},
];
const COLL_DETAIL_COLUMNS=[
  {th:'<th>Müqavilə №</th>', xl:'Müqavilə №', type:'text', width:14, td:r=>`<td>${esc(r.nomre||'—')}</td>`, val:r=>r.nomre},
  {th:'<th>Müştəri (SAA)</th>', xl:'Müştəri (SAA)', type:'text', width:36, td:r=>`<td>${esc(r.cust||'—')}</td>`, val:r=>r.cust},
  {th:'<th>Təhsilatçı</th>', xl:'Təhsilatçı', type:'text', width:30, td:r=>`<td class="muted">${esc(r.colName)}</td>`, val:r=>r.colName},
  {th:'<th>Tip</th>', xl:'Tip', type:'text', width:15, td:r=>`<td><span class="tag ${r.ret?'tag-red':'tag-green'}">${r.ret?'Geri qaytarma':'Ödəniş'}</span></td>`, val:r=>r.ret?'Geri qaytarma':'Ödəniş'},
  {th:'<th class="num">Daxil olma<br>məbləği</th>', xl:'Daxil olma məbləği', type:'money', width:18, td:r=>`<td class="num">${r.ret?'':fmtMoney(r.amt)}</td>`, val:r=>r.ret?null:r.amt},
  {th:'<th class="num">Geri<br>qaytarma</th>', xl:'Geri qaytarma', type:'money', width:16, td:r=>`<td class="num" style="color:var(--red);">${r.ret?fmtMoney(r.amt):''}</td>`, val:r=>r.ret?r.amt:null},
  {th:'<th>Tarix</th>', xl:'Tarix', type:'date', width:14, td:r=>`<td>${fmtDate(r.date)}</td>`, val:r=>r.date},
];
function collFilterDescription(f){
  f=f||coll.applied||collFilters;
  const out=[{l:'Tarix (dan)',v:fmtDate(f.from)},{l:'Tarix (dək)',v:fmtDate(f.to)}];
  if(f.collector) out.push({l:'Təhsilatçı',v:collCollectorName(f.collector===COLL_NONE?'':f.collector)});
  return out;
}
function refreshCollections(){
  const box=document.getElementById('coll-body');
  if(!box) return;
  const eb=document.getElementById('export-btn');
  const ready=!!coll.applied && !coll.loading && !coll.err && coll.loadedKey===collKey();
  if(eb){ eb.disabled=!(ready && coll.rows.length); eb.textContent=(ready && coll.rows.length)?('Excelə yüklə — '+coll.rows.length+' sətir'):'Excelə yüklə'; }
  const sumEl=document.getElementById('coll-summary');
  if(coll.err){ sumEl.innerHTML=''; box.innerHTML=`<div class="banner">${esc(coll.err)}</div>`; return; }
  if(!coll.applied){ sumEl.innerHTML=''; box.innerHTML=`<div class="card muted" style="padding:40px;text-align:center;">${REPORT_PROMPT}</div>`; return; }
  if(!ready){ sumEl.innerHTML=''; box.innerHTML=`<div class="card muted" style="padding:40px;text-align:center;">Yüklənir…</div>`; return; }
  const sum=collSummaryRows(coll.rows), tot=collTotals(sum);
  sumEl.innerHTML=
    `<strong>${tot.cnt}</strong> ödəniş &nbsp;·&nbsp; Toplanmış: <strong>${fmtMoney(tot.paid)}</strong> &nbsp;·&nbsp; Geri qaytarma: <strong>${fmtMoney(tot.ret)}</strong> &nbsp;·&nbsp; Xalis: <strong>${fmtMoney(tot.net)}</strong>`;
  if(coll.tab==='summary'){
    const body=sum.length
      ? sum.map(g=>`<tr>${COLL_SUMMARY_COLUMNS.map(c=>c.td(g)).join('')}</tr>`).join('')
        +`<tr class="total-row"><td>Cəmi</td><td class="num">${tot.cnt}</td><td class="num">${fmtMoney(tot.paid)}</td><td class="num">${fmtMoney(tot.ret)}</td><td class="num">${fmtMoney(tot.net)}</td></tr>`
      : `<tr><td colspan="${COLL_SUMMARY_COLUMNS.length}" class="empty" style="padding:40px;">Seçilmiş dövrdə ödəniş yoxdur</td></tr>`;
    box.innerHTML=`<div class="card"><div class="table-scroll"><table class="table-compact" id="coll-table">
      <thead><tr>${COLL_SUMMARY_COLUMNS.map(c=>c.th).join('')}</tr></thead><tbody>${body}</tbody></table></div></div>`;
    return;
  }
  const {pageRows, totalPages, total}=paginateArr(coll.rows,'report-collections',COLL_PAGE_SIZE);
  const body=pageRows.length
    ? pageRows.map(r=>`<tr>${COLL_DETAIL_COLUMNS.map(c=>c.td(r)).join('')}</tr>`).join('')
    : `<tr><td colspan="${COLL_DETAIL_COLUMNS.length}" class="empty" style="padding:40px;">Seçilmiş dövrdə ödəniş yoxdur</td></tr>`;
  box.innerHTML=`<div class="card"><div class="table-scroll"><table class="table-compact" id="coll-table" style="min-width:900px;">
    <thead><tr>${COLL_DETAIL_COLUMNS.map(c=>c.th).join('')}</tr></thead><tbody>${body}</tbody></table></div>
    <div id="pagination-report-collections" style="padding:0 14px 14px;">${paginationHtml('report-collections',totalPages,total)}</div></div>`;
}
// «Axtar»: filtrləri yoxlayır, surətini götürür (applied) və serverdən məlumatı gətirir
async function searchCollections(){
  const e=collFilterError(collFilters);
  if(e){ coll.err=e; coll.applied=null; coll.rows=[]; coll.loadedKey=''; refreshCollections(); return; }
  coll.applied=JSON.parse(JSON.stringify(collFilters));
  await reloadCollections();
}
async function reloadCollections(){
  pageNum['report-collections']=1;
  const p=loadCollections();
  refreshCollections();
  await p;
  if(currentScreen==='report-collections') refreshCollections();
}

      </div>
    </div>
    <div class="card" style="padding:16px 18px;margin-bottom:14px;">

/* ---- Hesabat 3: Müqavilə axtarışı ----
   Sətirlər serverdən gəlir (report-api.php?report=contracts): bütün filtrlər serverdə, əhatə serverdə.
   Filtrlər arasında VƏ. Təhsilatçı/kurator: "Cari" — hazırkı, "Ümumi" — tarixçədə nə vaxtsa olub.
   «Axtar» qaydası (REPORT_SEARCH): filtr dəyişəndə nəticə avtomatik yenilənmir. */
const CS_PAGE_SIZE=50;
let csFilters={};
let cs={applied:null, rows:[], loading:false, err:'', req:0};
function resetCsFilters(){
  csFilters={nomre:'',tarixDan:'',tarixDek:'',musteri:'',fin:'',tel:'',satici:'',tehsilatci:'',tehsilatciMode:'cur',kurator:'',kuratorMode:'cur',
    satisMin:'',satisMax:'',ilkinMin:'',ilkinMax:'',muddetMin:'',muddetMax:'',borcMin:'',borcMax:'',qrafikMin:'',qrafikMax:'',qeyd:'',mehkeme:''};

/* ============ EXCEL (.xlsx) EXPORT — brauzerdə, kənar kitabxanasız ============
   Qaydalar (QAYDALAR.md): hər hesabat REPORT_EXPORTS-da elan olunur və export düyməsini avtomatik alır;
   fayl yaradılmazdan ƏVVƏL export loga yazılır — loga yazılmasa fayl yaradılmır. */

function xlEsc(s){
  return String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFE\uFFFF]/g,'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function xlColName(i){ let s=''; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; }
// 'YYYY-MM-DD' -> Excel tarix seriyası (1899-12-30-dan gün sayı)
function xlDateSerial(iso){
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||''));
  if(!m) return null;
  return Math.round((Date.UTC(+m[1],+m[2]-1,+m[3])-Date.UTC(1899,11,30))/86400000);
}
// Üslublar: 0 adi, 1 başlıq, 2 məbləğ (#,##0.00), 3 tarix (dd.mm.yyyy), 4 tam ədəd, 5 qalın
function xlCellXml(ref, v, type, style){
  if(v===null || v===undefined || v==='') return '';
  if(type==='money' || type==='int'){
    let n=Number(v); if(!isFinite(n)) return '';
    if(type==='money') n=Math.round(n*100)/100;
    return `<c r="${ref}" s="${type==='money'?2:4}"><v>${n}</v></c>`;
  }
  if(type==='date'){
    const n=xlDateSerial(v); if(n===null) return '';
    return `<c r="${ref}" s="3"><v>${n}</v></c>`;
  }
  // Mətn həmişə "inlineStr" kimi yazılır: "=", "+", "@" ilə başlayan mətn Excel-də düstur kimi icra OLUNMUR
  return `<c r="${ref}"${style?` s="${style}"`:''} t="inlineStr"><is><t xml:space="preserve">${xlEsc(String(v).slice(0,32000))}</t></is></c>`;
}
// sheet: {name, columns:[{label,type,width}]|null, widths?, rows:[[cell|{v,t,s}]], freeze, filter}
function xlSheetXml(sh, isFirst){
  const cols=sh.columns||[];
  const widths=sh.widths||cols.map(c=>c.width||14);
  const ncols=Math.max(cols.length, widths.length, ...sh.rows.map(r=>r.length), 1);
  const nrows=sh.rows.length+(cols.length?1:0);
  const out=[];
  out.push('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">');
  out.push(`<dimension ref="A1:${xlColName(ncols-1)}${Math.max(nrows,1)}"/>`);
  out.push('<sheetViews><sheetView workbookViewId="0"'+(isFirst?' tabSelected="1"':'')+'>'
    +(sh.freeze && cols.length?'<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A2" sqref="A2"/>':'')
    +'</sheetView></sheetViews>');
  out.push('<sheetFormatPr defaultRowHeight="15"/>');
  out.push('<cols>'+widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols>');
  out.push('<sheetData>');
  let r=0;
  if(cols.length){
    r++;
    out.push(`<row r="${r}">`+cols.map((c,i)=>xlCellXml(xlColName(i)+r,c.label,'text',1)).join('')+'</row>');
  }
  for(const row of sh.rows){
    r++;
    let x=`<row r="${r}">`;
    for(let i=0;i<row.length;i++){
      const cell=row[i];
      const ov=cell!==null && typeof cell==='object' && 'v' in cell;
      x+=xlCellXml(xlColName(i)+r, ov?cell.v:cell, ov?(cell.t||'text'):(cols[i]?cols[i].type:'text'), ov?cell.s:undefined);
    }
    out.push(x+'</row>');
  }
  out.push('</sheetData>');
  if(sh.filter && cols.length) out.push(`<autoFilter ref="A1:${xlColName(cols.length-1)}${nrows}"/>`);
  out.push('</worksheet>');
  return out.join('');
}
function xlSheetName(name,i){
  const n=String(name||'').replace(/[\[\]:*?\/\\]/g,' ').trim().slice(0,31);
  return n||('Vərəq'+(i+1));
}

/* ---- ZIP (xlsx bir ZIP arxividir) ---- */
const _crcTable=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=_crcTable[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
async function deflateRaw(u8){
  if(typeof CompressionStream==='undefined') return null;      // köhnə brauzer: sıxılmadan yazılır
  try{
    const stream=new Blob([u8]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }catch(e){ return null; }
}
async function zipBuild(files){
  const enc=new TextEncoder(), chunks=[], central=[];
  let offset=0;
  const d=new Date();
  const dosTime=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  const dosDate=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate());
  for(const f of files){
    const nameB=enc.encode(f.name), crc=crc32(f.data);
    let comp=await deflateRaw(f.data), method=8;
    if(!comp || comp.length>=f.data.length){ comp=f.data; method=0; }
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,method,true);
    lh.setUint16(10,dosTime,true); lh.setUint16(12,dosDate,true); lh.setUint32(14,crc,true);
    lh.setUint32(18,comp.length,true); lh.setUint32(22,f.data.length,true); lh.setUint16(26,nameB.length,true); lh.setUint16(28,0,true);
    chunks.push(new Uint8Array(lh.buffer),nameB,comp);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,method,true);
    ch.setUint16(12,dosTime,true); ch.setUint16(14,dosDate,true); ch.setUint32(16,crc,true);
    ch.setUint32(20,comp.length,true); ch.setUint32(24,f.data.length,true); ch.setUint16(28,nameB.length,true);
    ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer),nameB);
    offset+=30+nameB.length+comp.length;
  }
  const centralSize=central.reduce((a,c)=>a+c.length,0);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
  end.setUint32(12,centralSize,true); end.setUint32(16,offset,true);
  return new Blob([...chunks,...central,new Uint8Array(end.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

async function xlBuildBlob(sheets){
  const enc=new TextEncoder();
  const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  const REL='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const names=sheets.map((s,i)=>xlSheetName(s.name,i));
  const files=[
    {name:'[Content_Types].xml', data:enc.encode(X+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
      +'<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>'
      +'<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
      +sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')
      +'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>')},
    {name:'_rels/.rels', data:enc.encode(X+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${REL}/officeDocument" Target="xl/workbook.xml"/></Relationships>`)},
    {name:'xl/workbook.xml', data:enc.encode(X+`<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="${REL}"><sheets>`
      +names.map((n,i)=>`<sheet name="${xlEsc(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+'</sheets></workbook>')},
    {name:'xl/_rels/workbook.xml.rels', data:enc.encode(X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      +sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="${REL}/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')
      +`<Relationship Id="rId${sheets.length+1}" Type="${REL}/styles" Target="styles.xml"/></Relationships>`)},
    {name:'xl/styles.xml', data:enc.encode(X+'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
      +'<numFmts count="1"><numFmt numFmtId="164" formatCode="dd\\.mm\\.yyyy"/></numFmts>'
      +'<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>'
      +'<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>'
      +'<fill><patternFill patternType="solid"><fgColor rgb="FFF3EFE4"/><bgColor indexed="64"/></patternFill></fill></fills>'
      +'<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'
      +'<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
      +'<cellXfs count="6">'
      +'<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
      +'<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>'
      +'<xf numFmtId="4" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>'
      +'<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>'
      +'<xf numFmtId="1" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>'
      +'<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>'
      +'</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>')},
    ...sheets.map((s,i)=>({name:`xl/worksheets/sheet${i+1}.xml`, data:enc.encode(xlSheetXml(s,i===0))})),
  ];
  return zipBuild(files);
}
function downloadBlob(blob, filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
}

// Export hadisəsini loga yazdır; yazılmasa istisna atılır və fayl YARADILMIR
async function logExport(key, count, filters){
  const r=await fetch('export-log.php',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({report:key, rows:count, filters:filters.map(f=>({l:f.l,v:f.v}))})});
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok || !j || !j.ok) throw new Error('Export loga yazıla bilmədi, fayl yaradılmadı. '+((j&&j.error)||('Server cavabı: '+r.status)));
}

async function exportReport(key){
  const def=REPORT_EXPORTS[key];
  if(!def) throw new Error('Naməlum hesabat: '+key);
  const rows=def.rows();
  if(!rows.length) throw new Error('Export üçün sətir yoxdur.');
  const filters=def.filters();
  await logExport(key, rows.length, filters);                       // 1) əvvəl log
  // Hesabat bir neçə vərəq elan edə bilər (sheets); elan etməyibsə bir vərəq — sütunlar ekrandakı elandan
  const defs=def.sheets?def.sheets(rows):[{name:def.title, columns:def.columns(), rows}];
  const dataSheets=defs.map(sd=>({
    name:sd.name, freeze:true, filter:sd.filter!==false,
    columns:sd.columns.map(c=>({label:c.xl, type:c.type, width:c.width})),
    rows:sd.rows.map(r=>sd.columns.map(c=>c.val(r))).concat(sd.extraRows||[]),
  }));
  const info=[
    [{v:'Hesabat',s:5}, def.title],
    [{v:'Yüklənmə vaxtı (Bakı)',s:5}, fmtBaku(new Date().toISOString().slice(0,19).replace('T',' '))],
    [{v:'İstifadəçi',s:5}, currentUsername||'—'],
    [{v:'Sətir sayı',s:5}, {v:rows.length,t:'int'}],
    ...def.totals(rows).map(t=>[{v:t[0],s:5},{v:t[1],t:'money'}]),
    ['',''],
    [{v:'Tətbiq olunan filtrlər',s:5}, filters.length?'':'Filtr yoxdur (bütün nəticələr)'],
    ...filters.map(f=>[f.l, f.v]),
  ];
  const blob=await xlBuildBlob([...dataSheets,{name:'Məlumat', widths:[30,60], rows:info}]);   // 2) fayl
  downloadBlob(blob, def.file+'_'+bakuDateIso()+'.xlsx');
}

// Log vaxtları serverdə UTC saxlanılır; burada Bakı vaxtı ilə göstərilir
const _bakuFmt=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Baku',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function fmtBaku(utc){
  if(!utc) return '';
  const d=new Date(String(utc).replace(' ','T')+'Z');
  if(isNaN(d)) return String(utc);
  const p={}; _bakuFmt.formatToParts(d).forEach(x=>{ p[x.type]=x.value; });
  return p.day+'.'+p.month+'.'+p.year+' '+p.hour+':'+p.minute;
}
function isoLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function uuidv4(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{ const r=Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); });
}

function auditDefaultFilters(){
  const d=new Date(); d.setDate(d.getDate()-30);
  return {from:isoLocal(d),to:'',user:'',kind:'',actionType:'',entity:'',q:'',entityId:'',contractId:'',opId:'',scope:''};
}

function auditParams(f, page, size){
  const p=new URLSearchParams();
  p.set('action','list'); p.set('page',page); p.set('size',size);
  ['from','to','user','kind','actionType','entity','entityId','contractId','opId'].forEach(k=>{ if(f[k]) p.set(k,f[k]); });
  if((f.q||'').trim().length>=3) p.set('q',f.q.trim());
  return p;
}
async function auditFetch(params){
  const r=await fetch('audit-api.php?'+params.toString());
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw new Error((j&&j.error)||('Log yüklənmədi ('+r.status+')'));
  return j;
}

async function loadAuditPage(){
  const tbody=document.getElementById('audit-tbody');
  if(!tbody) return;
  const my=++auditReq;
  try{
    const j=await auditFetch(auditParams(auditFilters, pageNum['audit-log']||1, AUDIT_PAGE_SIZE));
    if(my!==auditReq) return;   // arada daha yeni sorğu başlayıb
    const totalPages=Math.max(1,Math.ceil(j.total/AUDIT_PAGE_SIZE));
    tbody.innerHTML=j.rows.length ? j.rows.map(r=>auditRowHtml(r,j.grouped)).join('')
      : `<tr><td colspan="5" class="empty" style="padding:40px;">Nəticə tapılmadı</td></tr>`;
    document.getElementById('pagination-audit-log').innerHTML=paginationHtml('audit-log',totalPages,j.total);
    document.getElementById('audit-summary').textContent=j.total+' qeyd'+(j.grouped?' (toplu əməliyyatlar bir sətirdə göstərilir)':'');

    const pg=document.getElementById('pagination-audit-log'); if(pg) pg.innerHTML='';

function auditChangesTable(ch, bothColumns, newLabel){
  if(!ch || !ch.length) return '';
  const hasOld=bothColumns || ch.some(c=>c.o), hasNew=bothColumns || ch.some(c=>c.n);
  const rows=ch.map(c=>`<tr><td>${esc(c.l||c.f)}</td>${hasOld?`<td>${esc(c.o||'—')}</td>`:''}${hasNew?`<td>${esc(c.n||'—')}</td>`:''}</tr>`).join('');
  return `<div class="card" style="margin-top:12px;"><div class="table-scroll"><table class="table-compact diff">
    <thead><tr><th>Sahə</th>${hasOld?'<th>Köhnə</th>':''}${hasNew?'<th>'+(newLabel||'Yeni')+'</th>':''}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

let hist={params:null,rows:[],total:0,page:0,loading:false,error:'',expanded:{},detail:{},title:''};
async function openHistoryModal(kind,id,title){
  const panel=document.getElementById('modal-panel');
  panel.classList.add('wide');
  hist={params:(kind==='contract'?{contractId:id}:{entity:kind,entityId:id}),rows:[],total:0,page:0,loading:false,error:'',expanded:{},detail:{},title:title||''};
  renderHistory();
  openModal();
  await histLoadMore();
}
async function histLoadMore(){
  if(hist.loading || !hist.params) return;
  hist.loading=true; hist.error=''; renderHistory();
  try{
    const p=new URLSearchParams(Object.assign({action:'list',page:hist.page+1,size:AUDIT_PAGE_SIZE}, hist.params));
    const j=await auditFetch(p);
    hist.page=j.page; hist.total=j.total; hist.rows=hist.rows.concat(j.rows);
  }catch(err){ hist.error=err.message; }
  hist.loading=false;
  renderHistory();
}
async function histToggle(id){
  id=Number(id);
  if(hist.expanded[id]){ hist.expanded[id]=false; renderHistory(); return; }
  hist.expanded[id]=true;
  if(!hist.detail[id]){
    renderHistory();
    try{ hist.detail[id]=await auditFetch(new URLSearchParams({action:'detail',id})); }
    catch(err){ hist.detail[id]={changes:[],summary:err.message}; }
  }
  renderHistory();
}
function renderHistory(){
  const panel=document.getElementById('modal-panel');
  if(!panel || !hist.params) return;
  const rowsHtml=hist.rows.map(r=>{
    const isOther=r.entity && hist.params.contractId && r.entity!=='contracts';
    const label=isOther?`<span class="muted">${esc(AUDIT_ENTITIES[r.entity]||r.entity)}:</span> `:'';
    let html=`<tr class="clickable" data-action="hist-toggle" data-id="${r.id}">
      <td style="white-space:nowrap;">${fmtBaku(r.createdAt)}</td>
      <td>${esc(r.username||'—')}</td>
      <td>${auditActionTag(r.action,false)}</td>
      <td style="white-space:pre-wrap;word-break:break-word;">${label}${esc(r.summary||'')}</td></tr>`;
    if(hist.expanded[r.id]){
      const d=hist.detail[r.id];
      html+=`<tr><td colspan="4" style="background:rgba(184,134,63,.06);padding:4px 14px 14px;">${d?(auditChangesTable(d.changes, d.action==='UPDATE')||'<div class="muted" style="padding:10px 0;">Təfərrüat yoxdur</div>'):'<div class="muted" style="padding:10px 0;">Yüklənir…</div>'}</td></tr>`;
    }
    return html;
  }).join('');
  let body;
  if(hist.error) body=`<div class="banner">${esc(hist.error)}</div>`;
  else if(!hist.rows.length && hist.loading) body=`<div class="muted" style="padding:30px;text-align:center;">Yüklənir…</div>`;
  else if(!hist.rows.length) body=`<div class="muted" style="padding:24px 4px;line-height:1.6;">Hələ dəyişiklik qeydi yoxdur. Log yalnız bu funksiya işə düşəndən sonrakı dəyişiklikləri saxlayır.</div>`;
  else body=`<div class="card scroll-y"><div class="table-scroll"><table class="table-compact">
      <thead><tr><th>Tarix (Bakı)</th><th>İstifadəçi</th><th>Əməliyyat</th><th>Təfərrüat</th></tr></thead><tbody>${rowsHtml}</tbody></table></div></div>
      <div class="muted" style="font-size:12px;margin-top:8px;">Təfərrüat üçün sətrə basın.</div>`;
  const remaining=hist.total-hist.rows.length;
  const more=(remaining>0)?`<button type="button" class="btn btn-ghost btn-sm" data-action="hist-more"${hist.loading?' disabled':''}>Daha çox yüklə (${remaining} qalıb)</button>`:'';
  panel.innerHTML=`<h2>Tarixçə — ${esc(hist.title)}</h2>${body}
    <div class="modal-actions" style="justify-content:space-between;"><div>${more}</div><button type="button" class="btn btn-ghost" data-action="close-modal">Bağla</button></div>`;
}

function uaClone(o){ return JSON.parse(JSON.stringify(o)); }
function uaNorm(d){ const n=uaClone(d); UA_SCOPE_TYPES.forEach(([k])=>{ n.scope[k]=[...n.scope[k]].sort(); }); return JSON.stringify(n); }
function uaDirty(){ return !!ua.draft && !!ua.orig && uaNorm(ua.draft)!==uaNorm(ua.orig); }
function uaUser(){ return ua.users.find(x=>x.id===ua.selectedId)||null; }
async function uaApi(url,body){
  const r=await fetch(url, body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:undefined);
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw new Error((j&&j.error)||('Xəta ('+r.status+')'));
  return j;
}
function uaPersonName(key,id){ const p=(ua.people[key]||[]).find(x=>x.id===id); return p?p.name:'(silinmiş)'; }
function uaSummary(u){
  if(u.role==='admin') return 'Bütün hüquqlar';
  if(u.collectorId) return 'Təhsilatçı: '+uaPersonName('collectors',u.collectorId);
  const n=Object.values(u.screens).filter(v=>v>0).length;
  const sc=u.scope.mode==='all'?'bütün müqavilələr':((u.scope.salespeople.length+u.scope.collectors.length+u.scope.curators.length)+' seçim');
  return n+' ekran · '+sc;
}

function uaPreviewHtml(){

function uaRefreshBar(){
  const bar=document.getElementById('ua-bar'); if(bar) bar.innerHTML=uaBarHtml();
  const list=document.getElementById('ua-users'); if(list) list.innerHTML=uaUsersListHtml();
}
function uaSchedulePreview(delay){
  clearTimeout(uaPreviewTimer);
  const u=uaUser();
  if(!u || u.role==='admin' || !ua.draft) return;
  uaPreviewTimer=setTimeout(async ()=>{
    const my=++uaPreviewReq;
    try{
      const j=await uaApi('users-api.php?action=preview',{scope:ua.draft.scope, collectorId:ua.draft.collectorId||''});
      if(my!==uaPreviewReq) return;
      ua.preview=j;
    }catch(err){ if(my!==uaPreviewReq) return; ua.preview={error:err.message}; }
    const el=document.getElementById('ua-preview'); if(el) el.innerHTML=uaPreviewHtml();
  }, delay===undefined?300:delay);
}
function uaRedrawEditor(){
  const ed=document.getElementById('ua-editor'); if(ed) ed.innerHTML=uaEditorHtml();
  uaRefreshBar();
  uaSchedulePreview(0);
}
function uaSelect(id){
  if(uaDirty() && !confirm('Yadda saxlanılmamış dəyişikliklər var. Başqa istifadəçiyə keçilsin?')) return;
  const u=ua.users.find(x=>x.id===id); if(!u) return;
  ua.selectedId=id; ua.msg=''; ua.preview=null;
  if(u.role==='admin'){ ua.draft=null; ua.orig=null; }
  else {
    ua.orig={screens:uaClone(u.screens),extras:uaClone(u.extras),scope:uaClone(u.scope),collectorId:u.collectorId||''};
    ua.draft=uaClone(ua.orig);
  }
  const list=document.getElementById('ua-users'); if(list) list.innerHTML=uaUsersListHtml();
  const ed=document.getElementById('ua-editor'); if(ed) ed.innerHTML=uaEditorHtml();
  uaSchedulePreview(0);
}
function uaPreset(p){
  if(!ua.draft) return;
  ua.draft.screens={};
  ua.screens.forEach(s=>{ ua.draft.screens[s.key]= p==='none'?0 : p==='view'?1 : (UA_MAX[s.key]||3); });
  ua.extras.forEach(x=>{ ua.draft.extras[x.key]= (p==='full'); });
  ua.msg=''; uaRedrawEditor();
}
function uaSetLevel(key,L,checked){
  const max=UA_MAX[key]||3;
  ua.draft.screens[key]=Math.min(max, checked?L:L-1);
  const lv=ua.draft.screens[key];
  document.querySelectorAll(`[data-ua-screen="${key}"]`).forEach(cb=>{ cb.checked=lv>=Number(cb.dataset.lv); });
  ua.msg=''; uaRefreshBar();
}
function uaTogglePerson(key,id,checked){
  const set=new Set(ua.draft.scope[key]);
  if(checked) set.add(id); else set.delete(id);
  ua.draft.scope[key]=[...set];
  const c=document.getElementById('ua-count-'+key); if(c) c.textContent='('+set.size+' seçilib)';
  ua.msg=''; uaRefreshBar(); uaSchedulePreview();
}
function uaSelectAll(key,all){
  ua.draft.scope[key]= all ? (ua.people[key]||[]).map(p=>p.id) : [];
  document.querySelectorAll(`[data-ua-person="${key}"]`).forEach(cb=>{ cb.checked=all; });
  const c=document.getElementById('ua-count-'+key); if(c) c.textContent='('+ua.draft.scope[key].length+' seçilib)';
  ua.msg=''; uaRefreshBar(); uaSchedulePreview();
}
function uaCancel(){
  if(!ua.orig) return;
  ua.draft=uaClone(ua.orig); ua.msg=''; uaRedrawEditor();
}
async function uaSave(){
  const u=uaUser(); if(!u || !ua.draft) return;
  try{
    const j=await uaApi('users-api.php?action=save',{userId:u.id, screens:ua.draft.screens, extras:ua.draft.extras, scope:ua.draft.scope, collectorId:ua.draft.collectorId||''});
    if(j.scope) ua.draft.scope=Object.assign({mode:ua.draft.scope.mode}, {salespeople:j.scope.salespeople,collectors:j.scope.collectors,curators:j.scope.curators});
    u.screens=uaClone(ua.draft.screens); u.extras=uaClone(ua.draft.extras); u.scope=uaClone(ua.draft.scope); u.collectorId=ua.draft.collectorId||null; u.configured=true;
    ua.orig=uaClone(ua.draft);
    ua.msg=j.changed===false?'Dəyişiklik yoxdur':'Yadda saxlandı ✓'; ua.msgOk=true;
  }catch(err){ ua.msg=err.message; ua.msgOk=false; }
  uaRedrawEditor();
}

async function withButtonLoading(btn, fn){
  if(!btn) return fn();
  const prevDisabled=btn.disabled;
  btn.disabled=true;
  btn.style.opacity='.6';
  btn.style.cursor='not-allowed';
  try{
    return await fn();
  } finally {
    btn.disabled=prevDisabled;
    btn.style.opacity='';
    btn.style.cursor='';
  }
}

  if(ds.uaMode && ua.draft){ ua.draft.scope.mode=ds.uaMode; ua.msg=''; uaRedrawEditor(); return; }
  if(ds.uaCollector && ua.draft){ ua.draft.collectorId=t.value; ua.msg=''; uaRedrawEditor(); return; }
  if(ds.uaPerson && ua.draft){ uaTogglePerson(ds.uaPerson, t.value, t.checked); return; }
});
// Hesabat filtr sahəsində Enter = «Axtar»
document.addEventListener('keydown', (e)=>{
  if(e.key!=='Enter') return;
  const ds=(e.target && e.target.dataset)||{};
  const key=ds.ofilter!==undefined?'overdue':(ds.cfilter!==undefined?'collections':(ds.csfilter!==undefined?'contracts':(ds.crfilter!==undefined?'collector-reports':(ds.dsfilter!==undefined?'debtor-sales':null))));
  if(!key) return;
  e.preventDefault();
  if(ds.cfilter!==undefined) collFilters[ds.cfilter]=e.target.value;   // tarix sahəsi "change" verməmiş ola bilər
  if(ds.csfilter!==undefined && e.target.type!=='checkbox' && e.target.type!=='radio') csFilters[ds.csfilter]=e.target.value;
  const b=document.getElementById('report-search-'+key);
  if(b && !b.disabled) b.click();
});
document.addEventListener('input', (e)=>{
  if(e.target && e.target.dataset && e.target.dataset.crCalc){ crUpdateCalc(); return; }
  const dsf=e.target && e.target.dataset ? e.target.dataset.dsfilter : null;
  if(dsf){ dsFilters[dsf]=e.target.value; updateReportDirty('debtor-sales'); return; }
  const crf=e.target && e.target.dataset ? e.target.dataset.crfilter : null;
  if(crf){ crFilters[crf]=e.target.value; updateReportDirty('collector-reports'); return; }
  const csf=e.target && e.target.dataset ? e.target.dataset.csfilter : null;
  if(csf && e.target.type!=='checkbox' && e.target.type!=='radio'){ csFilters[csf]=e.target.value; updateReportDirty('contracts'); return; }
  const of=e.target && e.target.dataset ? e.target.dataset.ofilter : null;
  if(of){ overdueFilters[of]=e.target.value; updateReportDirty('overdue'); return; }   // yalnız «Axtar» ilə tətbiq olunur
  const us=e.target && e.target.dataset ? e.target.dataset.uaSearch : null;
  if(us){
    const q=e.target.value.trim().toLowerCase();
    document.querySelectorAll('#ua-list-'+us+' .ua-item').forEach(it=>{ it.style.display=(!q||it.dataset.name.includes(q))?'':'none'; });
    return;
  }
  const af=e.target && e.target.dataset ? e.target.dataset.afilter : null;
  if(af){
    auditFilters[af]=e.target.value; pageNum['audit-log']=1;
    if(af==='q'){ clearTimeout(auditQTimer); auditQTimer=setTimeout(loadAuditPage,350); } else { loadAuditPage(); }
    return;
  }
  if(e.target.id==='search-collector-reports'){
    const v=e.target.value, q=v.length>=3?v:'';
    pageNum['collector-reports']=1;
    const {pageRows,totalPages,total}=paginateArr(crListFiltered(q),'collector-reports');
    document.getElementById('tbody-collector-reports').innerHTML=crRowsHtml(pageRows);
    document.getElementById('pagination-collector-reports').innerHTML=paginationHtml('collector-reports',totalPages,total);
    return;
  }
  const map={'search-salespeople':'salespeople','search-collectors':'collectors','search-curators':'curators','search-customers':'customers','search-contracts':'contracts'};
  const key=map[e.target.id];
  if(!key) return;
  const val=e.target.value;
  const q=val.length>=3 ? val.toLowerCase() : '';
  if(SIMPLE_META[key]){
    const rows=state[key].filter(p=>!q || (p.kod+p.soyad+p.ad+p.ataAdi+(p.finKod||'')+(p.elaqeNomre1||'')).toLowerCase().includes(q));
    pageNum[key]=1;
    const {pageRows, totalPages, total}=paginateArr(rows, key);
    document.getElementById('tbody-'+key).innerHTML=renderSimpleRows(key, pageRows);
    document.getElementById('pagination-'+key).innerHTML=paginationHtml(key, totalPages, total);
  } else if(key==='customers'){
    const rows=state.customers.filter(c=>!q || (fullName(c)+' '+(c.kod||'')+' '+(c.finKod||'')+' '+(c.elaqeNomre1||'')).toLowerCase().includes(q));
    pageNum.customers=1;
    const {pageRows, totalPages, total}=paginateArr(rows, 'customers');
    document.getElementById('tbody-customers').innerHTML=renderCustomerRows(pageRows);
    document.getElementById('pagination-customers').innerHTML=paginationHtml('customers', totalPages, total);
  } else if(key==='contracts'){
    const rows=contractRowsFor(q);
    pageNum.contracts=1;
    const {pageRows, totalPages, total}=paginateArr(rows, 'contracts');
    document.getElementById('tbody-contracts').innerHTML=renderContractRows(pageRows);
    document.getElementById('pagination-contracts').innerHTML=paginationHtml('contracts', totalPages, total);
  }
});

/* ============ API LAYER (PHP backend: api.php) ============ */
const API_BASE='api.php?col=';
async function readErr(r, fallback){
  try{ const j=await r.json(); if(j&&j.error) return j.error; }catch(e){}
  return fallback;
}
async function apiList(col){
  const r=await fetch(API_BASE+col);
  if(!r.ok) throw new Error(await readErr(r,'Yükləmə xətası ('+col+')'));
  return r.json();
}
async function apiPaymentSums(){
  const r=await fetch(API_BASE+'payments&agg=sum');
  if(!r.ok) throw new Error(await readErr(r,'Yükləmə xətası (ödəniş cəmləri)'));
  return r.json();
}
async function apiPaymentLast(){
  const r=await fetch(API_BASE+'payments&agg=last');
  if(!r.ok) throw new Error(await readErr(r,'Yükləmə xətası (son ödəniş tarixləri)'));
  return r.json();
}
async function apiMonthSum(ym){
  const r=await fetch(API_BASE+'payments&agg=month&ym='+encodeURIComponent(ym));
  if(!r.ok) throw new Error(await readErr(r,'Yükləmə xətası (aylıq cəm)'));
  const j=await r.json();
  return Number(j.total)||0;
}
async function apiPaymentsForContract(contractId){
  const r=await fetch(API_BASE+'payments&contractId='+encodeURIComponent(contractId));
  if(!r.ok) throw new Error(await readErr(r,'Yükləmə xətası (ödənişlər)'));
  return r.json();
}
async function apiAdd(col,data){
  const r=await fetch(API_BASE+col,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  if(!r.ok) throw new Error(await readErr(r,'Əlavə etmə xətası ('+col+')'));
  return r.json();
}
async function apiUpdate(col,id,data,opts){
  const headers={'Content-Type':'application/json'};
  // Toplu əməliyyat: eyni opId ilə gedən sorğular logda bir əməliyyat kimi qruplaşdırılır
  if(opts && opts.opId){
    headers['X-Op-Id']=opts.opId;
    if(opts.opLabel) headers['X-Op-Label']=encodeURIComponent(opts.opLabel);
  }
  const r=await fetch(API_BASE+col+'&id='+encodeURIComponent(id),{method:'PUT',headers,body:JSON.stringify(data)});
  if(!r.ok) throw new Error(await readErr(r,'Yeniləmə xətası ('+col+')'));
  return r.json();
}
async function apiDelete(col,id){
  const r=await fetch(API_BASE+col+'&id='+encodeURIComponent(id),{method:'DELETE'});
  if(!r.ok) throw new Error(await readErr(r,'Silmə xətası ('+col+')'));
  return r.json();
}

// Əvvəl istifadəçinin hüquqları (whoami) alınır, sonra ona açıq olan ilk ekran göstərilir
function applyMe(u){
  me={username:u.username||'',role:u.role||'user',screens:u.screens||{},extras:u.extras||{},scopeMode:u.scopeMode||'selected'};
  currentUsername=me.username;
  document.getElementById('user-info').textContent=me.username+' ('+(isAdmin()?'Admin':'İstifadəçi')+')';
  if(isAdmin()) document.body.classList.add('is-admin');
}
setContent(`<div class="topbar"><div><h1>Yüklənir…</h1><div class="sub">Serverə qoşulur</div></div></div>`);
(async function boot(){
  let u=null;
  try{ const r=await fetch('whoami.php'); u=r.ok?await r.json():null; }catch(e){ u=null; }
  if(!u || !u.username){
    renderNav();
    setContent(`<div class="topbar"><div><h1>Sessiya bitib</h1></div></div><div class="banner">Zəhmət olmasa yenidən <a href="login.php">daxil olun</a>.</div>`);
    return;
  }
  applyMe(u);
  // Təhsilatçıya bağlı istifadəçi yalnız mobil səhifəni işlədir (server index.php-də də yönləndirir)
  if(u.collectorId){ location.href='tehsilat.php'; return; }
  const first=pickInitialScreen();
  if(!first && can('collector-mobile',1)){ location.href='tehsilat.php'; return; }
  if(!first){
    currentScreen='none';
    renderNav();
    setContent(`<div class="topbar"><div><h1>Hələ icazə verilməyib</h1><div class="sub">Hesabınıza hələ heç bir ekran açılmayıb.</div></div></div><div class="banner">Lazım olan ekranların açılması üçün admin ilə əlaqə saxlayın.</div>`);
    return;
  }
  currentScreen=first;
  await renderScreen();
})().catch(err=>{
  setContent(`<div class="topbar"><div><h1>Serverlə əlaqə qurulmadı</h1></div></div><div class="banner">${esc(err.message)}. Səhifəni yeniləyin (F5). Xəta davam etsə, api.php faylının və data qovluğunun düzgün yerləşdiyini yoxlayın.</div>`);
});
